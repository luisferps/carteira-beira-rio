[build]
  publish = "public"
  command = "npm install --omit=dev"

[functions]
  node_bundler = "esbuild"

[functions.api]
  included_files = ["netlify/functions/modelos/compra-venda.docx"]

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
