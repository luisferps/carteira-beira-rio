<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conferência Beira Rio</title>
<link rel="icon" href="logo.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#16181d;--mut:#6b7280;--ln:#e3e6eb;--az:#29c5f6;--azd:#0b8fbf;
--pg:#16a34a;--ac:#eab308;--ca:#4b5563;--at:#b91c1c;--ve:#ef4444;--fu:#d1d5db;--pa:#6fbf8a;--rp:#0d9488}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;align-items:center;gap:12px;padding:10px 20px;background:#111;color:#fff;position:sticky;top:0;z-index:5}
header img{height:30px;background:#fff;border-radius:6px;padding:2px}header b{font-size:16px}header .sp{flex:1}
header button{background:transparent;color:#fff;border:1px solid #444}
main{max-width:1250px;margin:0 auto;padding:18px}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:#fff;border-radius:7px;padding:7px 12px}
button.pri{background:var(--az);border-color:var(--az);color:#00202d;font-weight:600}button.pri:hover{background:var(--azd);color:#fff}
button.per{color:var(--at);border-color:#f3c1c1}button:disabled{opacity:.45;cursor:default}
input,select,textarea{font:inherit;border:1px solid var(--ln);border-radius:7px;padding:7px 9px;width:100%;background:#fff}
textarea{min-height:70px}label{font-size:12px;color:var(--mut);display:block;margin:0 0 3px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:14px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln)}
th{font-size:12px;color:var(--mut);font-weight:600}tr.lk{cursor:pointer}tr.lk:hover{background:#f0fbff}
.bar{height:8px;background:#eee;border-radius:9px;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:var(--pg)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#eef2f7}
.tag.ok{background:#dcfce7;color:#14532d}.tag.al{background:#fef3c7;color:#78350f}
.grid{display:flex;flex-direction:column;gap:8px}.lin{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.lin.lst{align-items:stretch}.evdil{background:#0369a1}
.lin .rot{width:78px;font-size:12px;color:var(--mut)}
.pc{width:74px;height:50px;border-radius:8px;border:2px solid transparent;font-size:11px;line-height:1.15;padding:3px;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative}
.pc small{font-size:10px;opacity:.9}
.acl{align-items:stretch}.acl .pc{width:auto;min-width:74px;max-width:150px;height:auto;min-height:50px;padding:3px 8px}
.pc.paga{background:var(--pg)}.pc.paga_atraso{background:var(--pa);color:#0f3d1f}.pc.quitada_acordo{background:var(--ac);color:#3a2c00}.pc.em_acordo{background:#fff;color:#3a2c00;border-color:var(--ac)}.pc.quitada_repact{background:var(--rp)}.pc.em_repact{background:#fff;color:#134e4a;border-color:var(--rp)}
.pc.cancelada{background:var(--ca)}.pc.em_atraso{background:var(--at)}.pc.vencida{background:var(--ve)}.pc.futura{background:var(--fu);color:#333}
.pc.anual{outline:2px dashed #333;outline-offset:1px}.grid.selmodo .pc{opacity:.3;filter:grayscale(.5);cursor:not-allowed}.grid.selmodo .pc.selok{opacity:1;filter:none;cursor:pointer}
.grid.selmodo .pc.sel{opacity:1;filter:none;transform:scale(1.08);box-shadow:0 0 0 4px #fff,0 0 0 8px #2563eb,0 6px 14px rgba(0,0,0,.35);z-index:2}
.pc.sel::after{content:'✔';position:absolute;left:4px;top:2px;background:#2563eb;color:#fff;border-radius:50%;width:16px;height:16px;font-size:11px;line-height:16px;text-align:center}
.pc .cf{position:absolute;top:2px;right:4px;font-size:10px}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mut)}.leg span:before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px;background:var(--c)}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.tot div{background:#f8fafc;border:1px solid var(--ln);border-radius:9px;padding:9px}
.tot b{display:block;font-size:17px}.tot .neg b{color:var(--at)}
.bt{display:flex;flex-wrap:wrap;gap:8px}
details{border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin-top:10px;background:#fff}summary{cursor:pointer;font-weight:600}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:20}
.modal .card{width:min(860px,100%);margin:0}.modal h3{margin:0 0 10px}
.drop{border:2px dashed #9bdcf3;border-radius:10px;padding:14px;text-align:center;color:var(--mut);background:#f3fbfe;cursor:pointer}
.drop img{max-width:100%;max-height:260px;margin-top:8px;border-radius:6px}
.aviso{background:#fef2f2;color:#7f1d1d;border:1px solid #fecaca;border-radius:8px;padding:8px 10px;margin:8px 0}
.info{background:#f0f9ff;color:#0c4a6e;border:1px solid #bae6fd;border-radius:8px;padding:8px 10px;margin:8px 0}
.mut{color:var(--mut);font-size:12px}.r{text-align:right}.hid{display:none}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.cb{text-align:left;background:#fff;border:1px solid var(--ln);border-left:5px solid var(--fu);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:140px}
.cb:hover{border-color:var(--az);box-shadow:0 2px 10px rgba(0,0,0,.06)}.cb.st-troca{background:#1e3a8a;border-color:#1e3a8a;border-left-color:#1e3a8a;color:#fff;opacity:.5}.cb.st-troca .cbt b,.cb.st-troca .cbn{color:#fff}.cb.st-troca .cbt span{color:#e5e7eb}.cb.st-dia{background:#bbf7d0;border-color:#16a34a;border-left-color:#16a34a}.cb.st-atraso{background:#fecaca;border-color:#dc2626;border-left-color:#dc2626}.cb.st-atrasoG{background:#b91c1c;border-color:#7f1d1d;border-left-color:#7f1d1d;color:#fff}.cb.st-atrasoG .cbt b,.cb.st-atrasoG .cbn{color:#fff}.cb.st-atrasoG .cbt span{color:#fecaca}.cb.st-canc{background:#000;border-color:#000;border-left-color:#000;color:#fff;opacity:.45}.cb.st-canc:hover{opacity:.8}.cb.st-retom{background:#3b0764;border-color:#3b0764;border-left-color:#3b0764;color:#fff;opacity:.45}.cb.st-dev{background:#a16207;border-color:#a16207;border-left-color:#a16207;color:#fff;opacity:.6}.cb.st-retom:hover,.cb.st-dev:hover{opacity:.8}.cb.st-retom .cbt b,.cb.st-retom .cbn,.cb.st-dev .cbt b,.cb.st-dev .cbn{color:#fff}.cb.st-retom .cbt span,.cb.st-dev .cbt span{color:#e5e7eb}.cb.st-canc .cbt b,.cb.st-canc .cbn{color:#fff}.cb.st-canc .cbt span{color:#9ca3af}.cb.st-conf{background:#fff;border-left-color:var(--fu)}
.cb.mini{min-height:0;height:96px;padding:8px 10px;gap:2px;overflow:hidden;justify-content:flex-start}.cb.mini .cbn{font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cgrid.mini{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.filtros button.on{background:var(--tx);color:#fff}
.cbt{display:flex;justify-content:space-between;align-items:baseline}.cbt b{font-size:20px}.cbt span{font-weight:600;color:var(--azd)}
.cbn{font-size:13px;line-height:1.25;min-height:32px}
.pc.ev{color:#fff}.evac{background:#a16207}.evco{background:#7c3aed}.evev{background:#334155}.evces{background:#ea580c}.evenc{background:#374151}.evrp{background:var(--rp)}.pc.ev{width:auto;min-width:92px;height:auto;min-height:58px;padding:5px 9px}
.pgl{border:1px solid var(--ln);border-radius:8px;padding:8px;margin-bottom:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media(max-width:600px){main{padding:10px}.pc{width:62px}.lin .rot{width:100%}}
.ficha{border:1px solid var(--ln);border-left:5px solid #2e9e4f;border-radius:10px;padding:12px;margin-top:10px;background:rgba(46,158,79,.04)}
.dado{border:1px solid var(--ln);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:2px;background:var(--card)}
.dado span{font-size:12px;color:#777}.dado b{font-size:14px;word-break:break-word}
.desc{white-space:pre-wrap;word-break:break-word;border:1px solid var(--ln);border-radius:8px;padding:10px;background:var(--card);line-height:1.45}
#f_descricao{overflow:hidden;resize:vertical;min-height:80px}
.pc.corr{outline:3px solid #7c3aed;outline-offset:2px}
.pc.ces{box-shadow:0 0 0 3px #fff,0 0 0 6px #ea580c}
.pc.corr.ces{outline:3px solid #7c3aed;box-shadow:0 0 0 6px #ea580c}
.pc:has(.orig){height:auto;min-height:50px}.orig{display:block;text-align:center;max-width:100%;white-space:normal;overflow-wrap:break-word;line-height:1.15;font-size:10px}
.pc.rep{outline:3px dotted #0d9488;outline-offset:2px}
</style>
</head>
<body>
<header><img src="logo.png" alt=""><b>Conferência Beira Rio</b><span class="sp"></span><span id="quem"></span><button id="sair" class="hid">Sair</button></header>
<main id="app"></main>
<div id="modal"></div>
<script>
const $=s=>document.querySelector(s), app=$('#app');
let PIN=''; try{PIN=localStorage.getItem('cbr_pin')||''}catch(e){}
let EU='', COMO='', LISTA=[], C=null, SEL=new Set(), SELMODO=false, X=null;
const NOME_MIN=new Set(['da','de','do','das','dos','e','di','du']);
const nome=v=>String(v??'').toLowerCase().replace(/\s+/g,' ').trim().split(' ').map((w,i)=>i&&NOME_MIN.has(w)?w:w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
const brl=v=>v==null||isNaN(v)?'—':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dbr=d=>d?String(d).slice(0,10).split('-').reverse().join('/'):'—';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r2=v=>Math.round(v*100)/100;
async function api(path,opt={}){
  const r=await fetch('/api/'+path,{method:opt.method||'GET',headers:{'x-pin':PIN,'x-como':COMO,'content-type':'application/json'},body:opt.body?JSON.stringify(opt.body):undefined});
  const d=await r.json().catch(()=>({erro:'Resposta inválida'}));
  if(r.status===401){PIN='';try{localStorage.removeItem('cbr_pin')}catch(e){}telaLogin(d.erro||'Senha inválida');throw new Error('401')}
  if(!r.ok||d.erro){alert(d.erro||'Erro');throw new Error(d.erro)}
  return d;
}
function telaLogin(msg){
  $('#quem').textContent='';$('#sair').classList.add('hid');
  app.innerHTML=`<div class="card" style="max-width:380px;margin:60px auto"><h3>Entrar</h3>${msg?`<div class="aviso">${msg}</div>`:''}
  <label>Senha</label><input id="pin" type="password" autofocus><br><br><button class="pri" id="ent">Entrar</button></div>`;
  const go=async()=>{PIN=$('#pin').value.trim();try{localStorage.setItem('cbr_pin',PIN)}catch(e){};iniciar()};
  $('#ent').onclick=go;$('#pin').onkeydown=e=>{if(e.key==='Enter')go()};
}
async function iniciar(){
  if(!PIN)return telaLogin();
  try{const d=await api('eu');EU=d.conferente}catch(e){return}
  $('#quem').innerHTML=EU==='luis'?'<button onclick="location.hash=\'\'">Minha conferência</button> <button onclick="location.hash=\'x\'">Cruzamento</button>':'Conferência da Secretária';
  $('#sair').classList.remove('hid');$('#sair').onclick=()=>{PIN='';try{localStorage.removeItem('cbr_pin')}catch(e){};telaLogin()};
  route();
}
window.onhashchange=()=>route();
function route(){const h=location.hash.slice(1);COMO='';
  if(h.startsWith('f/')&&EU==='luis'){COMO='final';abrirContrato(h.slice(2))}
  else if(h==='x'&&EU==='luis')telaCruzamento();
  else if(h.startsWith('x/')&&EU==='luis')cruzContrato(h.slice(2));
  else if(h.startsWith('c/'))abrirContrato(h.slice(2));else telaLista()}

/* ---------- LISTA ---------- */
let FILTRO='todos';
function statusC(c){if(c.cancelado)return /reaproveit/i.test(c.motivo_enc||'')?'troca':/retom/i.test(c.motivo_enc||'')?'retom':/distrat|devol/i.test(c.motivo_enc||'')?'dev':'canc';if(!+c.conferidas&&+c.vencidas)return 'conf';return +c.em_atraso?(+(c.devido??c.em_atraso_valor)>5000?'atrasoG':'atraso'):'dia'}
const STNOME={troca:'Troca de lote (crédito reaproveitado em outro contrato)',dia:'Em dia',atraso:'Em atraso',atrasoG:'Em atraso acima de R$ 5 mil',canc:'Cancelado',retom:'Retomado',dev:'Distrato (devolução)',conf:'A conferir'};const GRP=s=>s==='atrasoG'?'atraso':s==='troca'||s==='retom'||s==='dev'?'canc':s;
async function telaLista(){
  app.innerHTML='<div class="card">Carregando…</div>';
  LISTA=await api('contratos');
  const fech=LISTA.filter(c=>c.fechado_em).length;const cont={dia:0,atraso:0,canc:0,conf:0};LISTA.forEach(c=>cont[GRP(statusC(c))]++);
  const fb=(k,l,n)=>`<button data-f="${k}" class="${FILTRO===k?'on':''}">${l} (${n})</button>`;
  app.innerHTML=`<div class="card"><div class="bt" style="align-items:center"><h3 style="margin:0;flex:1">Contratos (${LISTA.length})</h3>
  <span class="tag ok">${fech} fechados</span><span class="tag">${LISTA.length-fech} abertos</span></div><br>
  <input id="bus" placeholder="Buscar por número, quadra/lote ou nome">
  <div class="filtros" id="filt">${fb('todos','Todos',LISTA.length)}${fb('dia','Em dia',cont.dia)}${fb('atraso','Em atraso',cont.atraso)}${fb('canc','Cancelados/encerrados',cont.canc)}${fb('conf','A conferir',cont.conf)}${fb('fech','Conferência fechada',fech)}</div></div><div class="cgrid mini" id="tb"></div>`;
  const desenha=()=>{const t=$('#bus').value.toLowerCase();
    $('#tb').innerHTML=LISTA.filter(c=>(!t||(c.numero+' q'+c.quadra+' l'+c.lote+' q'+c.quadra+'l'+c.lote+' '+(c.titular||'')).toLowerCase().includes(t))&&(FILTRO==='todos'||(FILTRO==='fech'?!!c.fechado_em:GRP(statusC(c))===FILTRO))).map(c=>{
      const st=statusC(c);
      return `<button class="cb mini st-${st}" title="${STNOME[st]}${GRP(st)==='atraso'?' — '+c.em_atraso+' parcela(s), devendo '+brl(+(c.devido??c.em_atraso_valor))+(c.devido!=null?' com multa, juros e correção':''):''}" onclick="location.hash='c/${c.numero}'">
      <div class="cbt"><b>${c.numero}</b><span>Q${c.quadra||'?'} L${c.lote||'?'}</span></div>
      <div class="cbn">${esc(nome(c.titular))}</div></button>`}).join('')||'<div class="mut">Nenhum contrato nesse filtro.</div>'};
  $('#bus').oninput=desenha;
  (async()=>{const fila=LISTA.filter(c=>!c.cancelado&&+c.em_atraso>0&&c.devido==null&&statusC(c)!=='conf');await Promise.all(fila.map(async c=>{try{const d=await api('contrato/'+c.numero),sv=C;C=d;c.devido=totais().at.tot;C=sv;if(document.getElementById('tb'))desenha()}catch(e){}}))})();$('#filt').onclick=e=>{const f=e.target.dataset?.f;if(!f)return;FILTRO=f;document.querySelectorAll('#filt button').forEach(b=>b.classList.toggle('on',b.dataset.f===f));desenha()};desenha();
}

/* ---------- CONTRATO: cálculos ---------- */
/* correção é UMA por ano, lançada na mensal de janeiro; as anuais herdam o mesmo percentual de todas as correções lançadas antes do vencimento delas */
function fatoresMensais(){const ms=C.correcoes.filter(c=>c.grupo==='mensal').sort((a,b)=>a.a_partir-b.a_partir);
  const base=Math.min(...C.titulos.filter(t=>t.grupo==='mensal'&&!t.conferente).map(t=>+t.valor_face).filter(v=>v>0));let prev=base;const out=[];
  for(const k of ms){const t=C.titulos.find(x=>x.grupo==='mensal'&&!x.conferente&&+x.numero===+k.a_partir);const data=k.data||t?.vencimento;const nv=+k.novo_valor;
    if(!/^Diluição/.test(k.obs||'')&&prev>0)out.push({data,f:nv/prev});prev=nv}return out}
function valorAno(t){
  if(t.grupo!=='mensal'&&t.grupo!=='anual')return Number(t.valor_face||0);
  if(t.grupo==='anual'){const pgA=C.pagamentos.find(p=>p.titulo_id==t.id&&+p.valor_cobranca>0);if(pgA&&t.vencimento<=C.hoje)return +pgA.valor_cobranca;}
  if(t.grupo==='anual'){/* histórico: vale o que já foi cobrado (correção de anual registrada); daqui pra frente, herda as correções de janeiro posteriores */
    const cs=C.correcoes.filter(c=>c.grupo==='anual'&&!/^Diluição/.test(c.obs||'')&&+c.a_partir<=+t.numero).sort((a,b)=>a.a_partir-b.a_partir);let v=Number(t.valor_face||0),desde='';
    if(cs.length){const k=cs[cs.length-1];v=+k.novo_valor;const ta=C.titulos.find(x=>x.grupo==='anual'&&!x.conferente&&+x.numero===+k.a_partir);desde=k.data||ta?.vencimento||''}
    for(const x of fatoresMensais())if(x.data&&t.vencimento&&x.data>desde&&x.data<=t.vencimento&&!(desde&&x.data.slice(0,4)===desde.slice(0,4)))v*=x.f;return Math.round(v*100)/100}
  const cs=C.correcoes.filter(c=>c.grupo===t.grupo&&c.a_partir<=t.numero).sort((a,b)=>a.a_partir-b.a_partir);
  return cs.length?Number(cs[cs.length-1].novo_valor):Number(t.valor_face||0);
}
function pascoa(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;return new Date(Date.UTC(y,mes-1,dia))}
const FERIADOS={};function feriados(y){if(FERIADOS[y])return FERIADOS[y];const f=new Set(['01-01','04-21','05-01','09-07','10-12','11-02','11-15','11-20','12-25'].map(x=>y+'-'+x));const p=pascoa(y);for(const d of [-48,-47,-2,60]){const x=new Date(p);x.setUTCDate(x.getUTCDate()+d);f.add(x.toISOString().slice(0,10))}return FERIADOS[y]=f}
/* vencimento em fim de semana ou feriado nacional passa para o próximo dia útil */
function proxUtil(iso){if(!iso)return iso;const d=new Date(String(iso).slice(0,10)+'T12:00:00Z');for(;;){const s=d.toISOString().slice(0,10),w=d.getUTCDay();if(w!==0&&w!==6&&!feriados(d.getUTCFullYear()).has(s))return s;d.setUTCDate(d.getUTCDate()+1)}}
function diasUteisDepois(venc,pago){const v=proxUtil(venc);return Math.max(0,Math.round((new Date(String(pago).slice(0,10))-new Date(v))/864e5))}
function estado(t){
  const hoje=C.hoje, pags=C.pagamentos.filter(p=>p.titulo_id==t.id), sit=C.situacoes.find(s=>s.titulo_id==t.id);
  const enc=C.eventos.find(e=>e.tipo==='encerramento'&&t.grupo!=='acordo'&&(()=>{const t0=C.titulos.find(x=>x.id==e.a_partir_titulo);return t0&&t.vencimento&&t.vencimento>=t0.vencimento})());
  if(sit&&sit.situacao==='cancelada'||enc)return 'cancelada';
  if(pags.length){const tarde=pags.some(p=>Number(p.multa_paga||0)+Number(p.juros_pago||0)+Number(p.honorarios_pago||0)>0.009||(p.confirmada_em&&(p.vencimento_boleto||t.vencimento)&&diasUteisDepois(p.vencimento_boleto||t.vencimento,p.confirmada_em)>3));return t.grupo!=='acordo'&&tarde?'paga_atraso':'paga'}
  const ac=C.acordos.find(a=>(a.titulos_origem||[]).map(Number).includes(Number(t.id)));
  if(ac){const pago=C.titulos.some(x=>x.acordo_id==ac.id&&C.pagamentos.some(p=>p.titulo_id==x.id));return ehRep(ac)?(pago?'quitada_repact':'em_repact'):(pago?'quitada_acordo':'em_acordo')}
  if(sit&&sit.situacao==='em_atraso')return 'em_atraso';
  if(t.vencimento&&t.vencimento<=hoje)return 'vencida';
  return 'futura';
}
function codTit(t){if(!t)return'?';if(t.grupo==='acordo'){const a=C.acordos.find(x=>x.id==t.acordo_id);return 'R'+(a?numAc(a):'')+(t.total>1?'.'+t.numero:'')}
  return ({mensal:'M',anual:'A',entrada:'E'}[t.grupo]||'P')+t.numero}
function origensAc(a){const g={},ord=[];for(const i of a.titulos_origem||[]){const c=codTit(C.titulos.find(t=>t.id==i)),m=c.match(/^(.*?)(\d+)$/);const k=m?m[1]:c;if(!g[k]){g[k]=[];ord.push(k)}if(m)g[k].push(+m[2])}
  return ord.map(k=>{const n=[...new Set(g[k])].sort((x,y)=>x-y),r=[];for(let i=0;i<n.length;i++){let j=i;while(j+1<n.length&&n[j+1]===n[j]+1)j++;r.push(j>i?n[i]+'/'+n[j]:''+n[i]);i=j}
    if(!r.length)return k;if(/\.$/.test(k))return k.slice(0,-1)+': '+r.join(', ');return r.map(x=>k+x).join(', ')}).join(', ')}
const ehRep=a=>a&&a.tipo==='repactuacao';const nomeAc=a=>(ehRep(a)?'Repactuação ':'Acordo ')+numAc(a);const nomeCurto=a=>(ehRep(a)?'Repact. ':'Acordo ')+numAc(a);

const NOMES={paga:'Paga em dia',paga_atraso:'Paga com atraso',quitada_acordo:'Paga em cobrança (acordo)',em_acordo:'Em acordo (sem pagamento ainda)',quitada_repact:'Paga por repactuação',em_repact:'Repactuada (boletos em aberto)',cancelada:'Cancelada',em_atraso:'Não paga (conferido)',vencida:'Vencida sem nada lançado',futura:'A vencer'};
const FATOR_ANO={2024:1.02,2025:1.0854,2026:1.02};
function fatorAnos(y0,y1){let f=1;for(let y=y0+1;y<=y1;y++)f*=FATOR_ANO[y]||1;return f}
function valorNoVenc(t){if(t.grupo!=='mensal'&&t.grupo!=='anual')return valorAno(t);
  const vs=C.titulos.filter(x=>x.grupo===t.grupo&&!x.conferente).map(x=>+x.valor_face).filter(v=>v>0);const base=vs.length?Math.min(...vs):+t.valor_face;
  const y0=+String(C.contrato.data_assinatura||t.vencimento).slice(0,4);return Math.max(valorAno(t),Math.round(base*fatorAnos(y0,+String(t.vencimento).slice(0,4))*100)/100)}
/* atraso: dia seguinte ao vencimento entra multa de 2%; juros de 1% a.m. correm dia a dia sobre a parcela; em cada janeiro
   (dia da 1ª parcela do ano) o saldo devido recebe a correção anual e os juros seguem sobre a parcela corrigida; com mais de
   60 dias entra o custo de cobrança de 10% sobre o débito (regra atual; antes era 30) */
function atrasoDe(t,ate){const v=valorAno(t),vd=valorNoVenc(t),dias=Math.max(0,Math.round((new Date(ate)-new Date(t.vencimento))/864e5));
  if(!dias)return{v,co:vd-v,mu:0,ju:0,ho:0,dias,tot:vd};
  const corr=t.grupo==='mensal'||t.grupo==='anual';const m0=C.titulos.find(x=>x.grupo==='mensal'&&!x.conferente);const dd=String((m0||t).vencimento).slice(8,10);
  let prC=vd,mu=vd*.02,ju=0,co=vd-v,cur=String(t.vencimento).slice(0,10);
  const cresce=ate2=>{const d=Math.max(0,Math.round((new Date(ate2)-new Date(cur))/864e5));ju+=prC*(Math.pow(1.01,d/30)-1);cur=ate2};
  if(corr)for(let y=+cur.slice(0,4)+1;y<=+String(ate).slice(0,4);y++){const dj=`${y}-01-${dd}`;if(dj<=cur||dj>ate)continue;cresce(dj);const f=FATOR_ANO[y]||1;co+=(v+co+mu+ju)*(f-1);prC*=f}
  cresce(String(ate).slice(0,10));
  const sub=v+co+mu+ju,ho=dias>60?sub*.10:0;return{v,co,mu,ju,ho,dias,tot:sub+ho}}
function encDe(v,venc,ate){const dias=Math.max(0,Math.round((new Date(ate)-new Date(venc))/864e5));if(!dias)return{mu:0,ju:0,ho:0,dias};

  for(const t of C.titulos){const e=estado(t);const venc=t.vencimento&&t.vencimento<=C.hoje;if(e==='cancelada')continue;
    if(t.grupo!=='acordo'&&venc){qv++;esp+=valorAno(t)}
    if(e==='vencida')pend++;
    if(venc&&(e==='vencida'||e==='em_atraso')){const k=atrasoDe(t,C.hoje);at.q++;at.pr+=k.v;at.co+=k.co;at.mu+=k.mu;at.ju+=k.ju;at.ho+=k.ho}}
  for(const p of C.pagamentos){const v=Number(p.valor_pago||0);rec+=v;
    const mu=Number(p.multa_paga||0),ju=Number(p.juros_pago||0),ho=Number(p.honorarios_pago||0),cp=Number(p.compensacao||0),base=v-mu-ju-ho-cp;
    pg.mu+=mu;pg.ju+=ju;pg.ho+=ho;pg.cp+=cp;pg.de+=Number(p.desconto_dado||0);
    const t=C.titulos.find(x=>x.id==p.titulo_id),a=t&&t.grupo==='acordo'?C.acordos.find(x=>x.id==t.acordo_id):null;
    if(a&&Number(a.valor_acordado)>0){const f=base/Number(a.valor_acordado);pg.pr+=Number(a.principal||0)*f;pg.mu+=Number(a.multa||0)*f;pg.ju+=Number(a.juros||0)*f;pg.ho+=Number(a.honorarios||0)*f}
    else pg.pr+=base}
  at.tot=at.pr+at.co+at.mu+at.ju+at.ho;
  return {qv,esp,rec,pend,pg,at};
}

/* acordo */
function calcAcordo(ids,data){
  let pr=0,mu=0,ju=0,maxd=0;
  for(const id of ids){const t=C.titulos.find(x=>x.id==id);const v=valorAno(t);pr+=v;
    const dias=Math.max(0,Math.round((new Date(data)-new Date(t.vencimento))/864e5));maxd=Math.max(maxd,dias);
    if(dias>0){mu+=v*.02;ju+=v*(Math.pow(1.01,dias/30)-1)}}
  const ho=maxd>30?(pr+mu+ju)*.10:0;return {principal:r2(pr),multa:r2(mu),juros:r2(ju),honorarios:r2(ho),total:r2(pr+mu+ju+ho)};
}

/* regra: principal, multa e juros calculados; o que sobrar é o custo de cobrança. Se não der, o que faltar sai dos juros e depois da multa (desconto). */
/* regra do Luis: o valor pago quita na ordem principal → multa → juros → custo de cobrança; o que não cobrir fica quitado, nunca vira desconto */
function repartir(c,v){let r=r2(v-Math.min(c.principal,v));const mu=Math.min(c.multa,r);r=r2(r-mu);const ju=Math.min(c.juros,r);r=r2(r-ju);
  return {multa:r2(mu),juros:r2(ju),honorarios:r2(r),desconto:0}}
async function salvaAcordo(aid){const b=window._salvaAcordoDados();
  const s=r2(b.parcelas.reduce((a,p)=>a+Number(p.valor||0),0));if(Math.abs(s-b.valor_acordado)>0.009)return alert('A soma das parcelas precisa ser igual ao valor acordado.');
  await api(aid?'acordo/'+aid:'acordo',{method:aid?'PUT':'POST',body:b});
  SEL.clear();SELMODO=false;fechaModal();recarrega()}

      const b=(t.grupo==='mensal'||t.grupo==='anual')?baseG(t.grupo):0,or=b&&parte>b?b:parte,co=r2(parte-or);T.or+=or;T.co+=co;T.mu+=mu;T.ju+=ju;T.ho+=ho;T.pg+=pg;

     <tfoot><tr><td colspan="4">Total (${ls.length} pagamentos)</td><td class="n">${brl(T.or)}</td><td class="n">${brl(T.co)}</td><td class="n">${brl(T.mu)}</td><td class="n">${brl(T.ju)}</td><td class="n">${brl(T.ho)}</td><td class="n">${brl(T.pg)}</td></tr></tfoot></table>`}
  else{titulo='Relatório de valores em atraso';

    corpo=ts.length?`<table><thead><tr><th>Parcela</th><th>Vencimento</th><th class="n">Dias de atraso</th><th class="n">Valor da parcela</th><th class="n">Multa 2%</th><th class="n">Juros 1% a.m.</th><th class="n">Correção</th><th class="n">Custo cobr.</th><th class="n">Total</th></tr></thead><tbody>${rows}</tbody>

  const w=window.open('','_blank');

   body{font-family:Arial,sans-serif;color:#111;margin:28px;font-size:13px}h1{font-size:19px;margin:0 0 4px}.cab{display:flex;gap:14px;align-items:center;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:12px}.cab img{height:46px}

   .bt{margin-bottom:12px}@page{size:A4 landscape;margin:10mm}@media print{.bt{display:none}body{margin:0}}</style></head><body>
   <div class="bt"><button onclick="print()">Imprimir / salvar em PDF</button></div>

async function salvaRepact(){const t=C.titulos.find(x=>x.id==$('#r_t').value);if(!t)return alert('Escolha a parcela.');

function cruzTitulo(id){

    return `<div class="card" style="flex:1;min-width:220px;margin:0"><h4 style="margin:0 0 6px">${NOMECONF[c]}</h4><div><b>${NOMES[est]||est}</b></div>
     ${sit?.obs?`<div class="mut">Obs.: ${esc(sit.obs)}</div>`:''}
     ${pg.map(p=>`<div class="pgl" style="display:block"><b>${brl(p.valor_pago)}</b> · entrou ${dbr(p.confirmada_em)}<br>fatura ${esc(p.fatura||'—')} · ${esc(p.forma||'')}<br><span class="mut">${esc((p.descricao||'').slice(0,160))}</span>${p.tem_print?`<br><button onclick="verPrintDe(${p.id},'${c}')">Ver print</button>`:''}</div>`).join('')||'<div class="mut">Nenhum pagamento lançado</div>'}
     <button class="pri" style="margin-top:8px" onclick="cruzUsar('titulo',${id},'${c}')">Usar esta versão</button></div>`};
  abreModal(`<div class="bt" style="align-items:center"><h3 style="flex:1">${esc(t.rotulo)} — vence ${dbr(t.vencimento)}</h3><button onclick="fechaModal()">Fechar</button></div>
   ${t.decidido?`<div class="info">Decidido: versão ${esc(NOMECONF[t.decidido.de]||t.decidido.de)} em ${new Date(t.decidido.em).toLocaleString('pt-BR')}</div>`:''}
   <div class="bt" style="align-items:stretch">${X.confs.map(col).join('')}</div>
   <div class="mut" style="margin-top:8px">Se nenhuma estiver certa, use "Abrir versão final para editar" e corrija direto na versão final.</div>`);
}
async function verPrintDe(id,c){const antes=COMO;COMO=c==='final'?'final':'';try{const d=await api('print/'+id);if(!d.conteudo)return alert('Print não disponível para a conferência de outra pessoa.');const w=window.open('');w.document.write(`<img src="${d.conteudo}" style="max-width:100%">`)}finally{COMO=antes}}
async function cruzUsar(tipo,alvo,de){
  await api('cruzamento/'+X.n,{method:'POST',body:tipo==='titulo'?{acao:'titulo',titulo_id:alvo,de}:{acao:'secao',secao:alvo,de}});
  fechaModal();cruzContrato(X.n);
}
async function cruzAcao(acao){await api('cruzamento/'+X.n,{method:'POST',body:{acao}});cruzContrato(X.n)}
async function cruzResolver(np){if(np&&!confirm(`Ainda há ${np} divergência(s) sem decisão. Marcar resolvido mesmo assim?`))return;cruzAcao('resolver')}

iniciar();
</script>
