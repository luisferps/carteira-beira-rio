<html lang="pt-BR">

<style>

.acoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}.acoes>button,.acoes>.tag{height:42px;width:100%;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;padding:4px 10px}body{margin:0;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}

.grid{display:flex;flex-direction:column;gap:8px}.lin{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.lin.lst{align-items:stretch}.evdil{background:#0369a1}.evcred{background:#15803d}.evdev{background:#0f766e}

.pc.paga{background:var(--pg)}.pc.paga_atraso{background:var(--pa);color:#0f3d1f}.pc.quitada_acordo{background:var(--pg);color:#fff;border:3px solid var(--ac)}.pc.em_acordo{background:var(--at);color:#fff;border:3px solid var(--ac)}.pc.quitada_repact{background:var(--rp)}.pc.em_repact{background:#fff;color:#134e4a;border-color:var(--rp)}

.grid.selmodo .pc.sel{opacity:1;filter:none;transform:scale(1.08);box-shadow:0 0 0 4px #fff,0 0 0 8px #2563eb,0 6px 14px rgba(0,0,0,.35);z-index:2}

.cb.pend{outline:4px dashed #f59e0b!important;outline-offset:2px!important;box-shadow:0 0 0 2px #fff,0 0 12px rgba(245,158,11,.7)!important}.cb.pend{position:relative;overflow:visible!important}.cbtip{display:none;position:absolute;left:0;top:100%;margin-top:6px;z-index:50;width:320px;max-width:80vw;background:#fffbeb;color:#422006;border:2px solid #f59e0b;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:400;line-height:1.35;text-align:left;white-space:normal;box-shadow:0 6px 18px rgba(0,0,0,.2)}.cb.pend:hover .cbtip{display:block}.cbp{display:inline-block;font-size:10px;font-weight:800;color:#000;background:#fbbf24;border-radius:4px;padding:0 4px;margin-top:3px}.cb:hover{border-color:var(--az);box-shadow:0 2px 10px rgba(0,0,0,.06)}.cb.st-troca{background:#1e3a8a;border-color:#1e3a8a;border-left-color:#1e3a8a;color:#fff;opacity:.5}.cb.st-troca .cbt b,.cb.st-troca .cbn{color:#fff}.cb.st-troca .cbt span{color:#e5e7eb}.cb.st-dia{background:#bbf7d0;border-color:#16a34a;border-left-color:#16a34a}.cb.st-atraso{background:#fecaca;border-color:#dc2626;border-left-color:#dc2626}.cb.st-atrasoG{background:#b91c1c;border-color:#7f1d1d;border-left-color:#7f1d1d;color:#fff}.cb.st-atrasoG .cbt b,.cb.st-atrasoG .cbn{color:#fff}.cb.st-atrasoG .cbt span{color:#fecaca}.cb.st-canc{background:#000;border-color:#000;border-left-color:#000;color:#fff;opacity:.45}.cb.st-canc:hover{opacity:.8}.cb.st-retom{background:#3b0764;border-color:#3b0764;border-left-color:#3b0764;color:#fff;opacity:.45}.cb.st-dev{background:#a16207;border-color:#a16207;border-left-color:#a16207;color:#fff;opacity:.6}.cb.st-retom:hover,.cb.st-dev:hover{opacity:.8}.cb.st-retom .cbt b,.cb.st-retom .cbn,.cb.st-dev .cbt b,.cb.st-dev .cbn{color:#fff}.cb.st-retom .cbt span,.cb.st-dev .cbt span{color:#e5e7eb}.cb.st-canc .cbt b,.cb.st-canc .cbn{color:#fff}.cb.st-canc .cbt span{color:#9ca3af}.cb.st-conf{background:#fff;border-left-color:var(--fu)}
.cb.mini{min-height:0;height:96px;padding:8px 10px;gap:2px;overflow:hidden;justify-content:flex-start}.cb.mini .cbn{font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cgrid.mini{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.filtros{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:6px;margin-top:10px}.filtros button{height:40px;width:100%;display:flex;align-items:center;justify-content:center;text-align:center}.filtros button.on{background:var(--tx);color:#fff}
.cbt{display:flex;justify-content:space-between;align-items:baseline}.cbt b{font-size:20px}.cbt span{font-weight:600;color:var(--azd)}
.cbn{font-size:13px;line-height:1.25;min-height:32px}
.pc.ev{color:#fff}.evac{background:#a16207}.evco{background:#7c3aed}.evev{background:#334155}.evces{background:#ea580c}.evenc{background:#374151}.evrp{background:var(--rp)}.pc.ev{width:auto;min-width:92px;height:auto;min-height:58px;padding:5px 9px}
.pgl{border:1px solid var(--ln);border-radius:8px;padding:8px;margin-bottom:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.ficha{border:1px solid var(--ln);border-left:5px solid #2e9e4f;border-radius:10px;padding:12px;margin-top:10px;background:rgba(46,158,79,.04)}
.dado{border:1px solid var(--ln);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:2px;background:var(--card)}
.dado span{font-size:12px;color:#777}.dado b{font-size:14px;word-break:break-word}
.desc{white-space:pre-wrap;word-break:break-word;border:1px solid var(--ln);border-radius:8px;padding:10px;background:var(--card);line-height:1.45}
#f_descricao{overflow:hidden;resize:vertical;min-height:80px}
.pc.corr{outline:3px solid #7c3aed;outline-offset:2px}
.pc.ces{box-shadow:0 0 0 3px #fff,0 0 0 6px #ea580c}
.pc.corr.ces{outline:3px solid #7c3aed;box-shadow:0 0 0 6px #ea580c}
.pc:has(.orig){height:auto;min-height:50px}.orig{display:block;text-align:center;max-width:100%;white-space:normal;overflow-wrap:break-word;line-height:1.15;font-size:10px}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);overflow-x:auto;gap:10px;padding-bottom:8px}.kcol{background:#f1f5f9;border-radius:10px;padding:8px;min-height:120px}.kh{font-weight:700;margin-bottom:8px}.kc{background:#fff;border:1px solid var(--ln);border-radius:7px;padding:5px 7px;margin-bottom:5px;cursor:pointer}body.largo main{max-width:none}.kc:hover{border-color:#1d4ed8}.cgrid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}.reg{border-left:3px solid #cbd5e1;padding:4px 10px;margin:8px 0}.reg-whatsapp{border-color:#25d366}.reg-ligacao{border-color:#2563eb}.reg-pagamento{border-color:#16a34a;background:#f0fdf4}.reg-acordo{border-color:#f59e0b}.reg-etapa,.reg-sistema{opacity:.75}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;max-width:900px;margin:30px auto}
.mod{text-align:left;background:var(--card);border:1px solid var(--ln);border-left:6px solid #1d4ed8;border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-height:150px}
.mod:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}.mod b{font-size:20px}.mod span{color:#666}
.tcl{width:100%;border-collapse:collapse}.tcl td,.tcl th{border-bottom:1px solid var(--ln);padding:7px 8px;text-align:left;vertical-align:top}.tcl tr.lk{cursor:pointer}.tcl tr.lk:hover{background:rgba(29,78,216,.05)}
.chip{display:inline-block;border:1px solid var(--ln);border-radius:20px;padding:1px 8px;margin:1px 3px 1px 0;font-size:12px;cursor:pointer;background:#fff}.chip.at{border-color:#2e9e4f;color:#166534;font-weight:700}.chip.old{color:#999;text-decoration:line-through}
.org{font-size:11px;border-radius:6px;padding:0 6px;margin-left:6px;background:#eef2ff;color:#3730a3}.org.pl{background:#fef3c7;color:#92400e}.org.mn{background:#dcfce7;color:#166534}

<body>
<header><img src="logo.png" alt=""><b>Carteira Beira Rio</b><span class="sp"></span><span id="quem"></span><button id="sair" class="hid">Sair</button></header>
<main id="app"></main>
<div id="modal"></div>
<script>
const $=s=>document.querySelector(s), app=$('#app');
let PIN=''; try{PIN=localStorage.getItem('cbr_pin')||''}catch(e){}
if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embed');
let EU='', COMO='', LISTA=[], C=null, SEL=new Set(), SELMODO=false, X=null;
const NOME_MIN=new Set(['da','de','do','das','dos','e','di','du']);
const nome=v=>String(v??'').toLowerCase().replace(/\s+/g,' ').trim().split(' ').map((w,i)=>i&&NOME_MIN.has(w)?w:w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
const brl=v=>v==null||isNaN(v)?'—':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dbr=d=>d?String(d).slice(0,10).split('-').reverse().join('/'):'—';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r2=v=>Math.round(v*100)/100;
async function api(path,opt={}){
  const r=await fetch('/api/'+path,{method:opt.method||'GET',headers:{'x-pin':PIN,'x-como':COMO,'content-type':'application/json'},body:opt.body?JSON.stringify(opt.body):undefined});
  const d=await r.json().catch(()=>({erro:'Resposta inválida'}));
  if(r.status===401){PIN='';try{localStorage.removeItem('cbr_pin')}catch(e){}telaLogin(d.erro||'Senha inválida');throw new Error('401')}
  if(!r.ok||d.erro){alert(d.erro||'Erro');throw new Error(d.erro)}
  return d;
}
function telaLogin(msg){
  $('#quem').textContent='';$('#sair').classList.add('hid');document.body.classList.remove('assist');
  app.innerHTML=`<div class="card" style="max-width:400px;margin:60px auto"><h3>Entrar</h3>${msg?`<div class="aviso">${msg}</div>`:''}
  <label>E-mail</label><input id="em" type="email" autocomplete="username" placeholder="seu e-mail (o administrador pode deixar em branco)"><br><br>
  <label>Senha</label><input id="pin" type="password" autocomplete="current-password"><br><br><button class="pri" id="ent">Entrar</button>
  <div style="margin-top:14px" class="mut">Não tem acesso? <a href="#cadastro" onclick="telaCadastro();return false">Criar meu acesso</a></div></div>`;
  const go=async()=>{const em=$('#em').value.trim(),s=$('#pin').value;
    if(em){const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:em,senha:s})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.token)return telaLogin(d.erro||'Não foi possível entrar.');PIN='tok:'+d.token}
    else PIN=s.trim();
    try{localStorage.setItem('cbr_pin',PIN)}catch(e){};iniciar()};
  $('#ent').onclick=go;$('#pin').onkeydown=e=>{if(e.key==='Enter')go()};
}
function telaSenha(tok,msg){
  app.innerHTML=`<div class="card" style="max-width:420px;margin:50px auto"><h3>Criar sua senha</h3>${msg?`<div class="aviso">${msg}</div>`:''}
  <div class="info">Crie a sua senha de acesso ao sistema. Ninguém mais vê essa senha.</div>
  <label>Senha (mínimo 8 caracteres)</label><input id="ns1" type="password"><br><br><label>Repita a senha</label><input id="ns2" type="password"><br><br><button class="pri" id="nsok">Salvar senha</button></div>`;
  $('#nsok').onclick=async()=>{if($('#ns1').value!==$('#ns2').value)return telaSenha(tok,'As senhas não conferem.');
    const r=await fetch('/api/definir-senha',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:tok,senha:$('#ns1').value})});const d=await r.json().catch(()=>({}));
    if(!r.ok)return telaSenha(tok,d.erro||'Erro.');location.hash='';telaLogin('Senha criada. Entre com o e-mail '+esc(d.email)+' e a senha que você acabou de criar.')}}
function telaCadastro(msg){
  app.innerHTML=`<div class="card" style="max-width:440px;margin:40px auto"><h3>Criar meu acesso</h3>${msg?`<div class="aviso">${msg}</div>`:''}
  <div class="info">Preencha seus dados e crie sua senha. Depois o administrador libera o seu acesso.</div>
  <label>Nome completo</label><input id="c_nome"><br><br><label>CPF</label><input id="c_cpf" inputmode="numeric"><br><br><label>Telefone</label><input id="c_tel" inputmode="tel"><br><br>
  <label>E-mail</label><input id="c_em" type="email"><br><br><label>Senha (mínimo 8 caracteres)</label><input id="c_s1" type="password"><br><br><label>Repita a senha</label><input id="c_s2" type="password"><br><br>
  <button class="pri" id="c_ok">Criar acesso</button> <button onclick="telaLogin()">Voltar</button></div>`;
  $('#c_ok').onclick=async()=>{if($('#c_s1').value!==$('#c_s2').value)return telaCadastro('As senhas não conferem.');
    const r=await fetch('/api/cadastro',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({nome:$('#c_nome').value,cpf:$('#c_cpf').value,telefone:$('#c_tel').value,email:$('#c_em').value,senha:$('#c_s1').value})});
    const d=await r.json().catch(()=>({}));if(!r.ok)return telaCadastro(d.erro||'Erro ao cadastrar.');
    app.innerHTML=`<div class="card" style="max-width:440px;margin:60px auto"><h3>Cadastro enviado</h3><p>${d.confirmar_email?'Enviamos um link para o seu e-mail. Confirme por ele e aguarde o administrador liberar o seu acesso.':'Agora é só aguardar o administrador liberar o seu acesso.'}</p><button onclick="telaLogin()">Ir para o login</button></div>`}}
async function iniciar(){
  if(location.hash==='#cadastro')return telaCadastro();
  if(location.hash.startsWith('#senha/'))return telaSenha(location.hash.slice(7));
  if(!PIN)return telaLogin();
  try{const d=await api('eu');EU=d.conferente;NOMEU=d.nome||''}catch(e){return}
  document.body.classList.toggle('assist',EU==='assistente');
  $('#quem').innerHTML=EU==='assistente'?`<button onclick="location.hash=''">Início</button> <span style="font-size:13px">${esc(NOMEU)} · assistente administrativo</span>`:'<button onclick="location.hash=\'\'">Início</button>';
  $('#sair').classList.remove('hid');$('#sair').onclick=()=>{PIN='';try{localStorage.removeItem('cbr_pin')}catch(e){};telaLogin()};
  route();
}
window.onhashchange=()=>route();
function route(){const h=location.hash.slice(1);COMO='';document.body.classList.toggle('largo',h==='cobranca');
  if(h.startsWith('f/')&&EU==='luis'){COMO='final';abrirContrato(h.slice(2))}
  else if(h==='x'&&EU==='luis')telaCruzamento();
  else if(h.startsWith('x/')&&EU==='luis')cruzContrato(h.slice(2));

async function gerarBol(){let ids=[...document.querySelectorAll('.bchk:checked')].map(c=>+c.value);if(!ids.length)return alert('Nenhuma parcela selecionada.');

  alert(`Pronto: ${ok} gerado(s)${er?', '+er+' com aviso (veja na lista)':''}.`)}

/* ---------- CLIENTES ---------- */
let CLI=[],CLIQ='',CLIF='todos';
const digs=v=>String(v??'').replace(/\D/g,'');
function fone(v){let d=digs(v);if(d.length>11&&d.startsWith('55'))d=d.slice(2);if(d.length===11)return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;if(d.length===10)return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;return d||''}
function cpfF(v){const d=digs(v);return d.length===11?d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4'):d.length===14?d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5'):d}
function cliDados(c){const P=c.planilha||{},A=c.asaas||{},M=c.manual||{};
  const tel=[],ja=new Set();const addT=(v,o,tipo)=>{const d=digs(v);if(d.length<8)return;const k=d.slice(-8);if(ja.has(k))return;ja.add(k);tel.push({v:fone(d),o,tipo})};
  addT(M.telefone,'Editado','');addT(A.mobilePhone,'Asaas','celular');addT(A.phone,'Asaas','fixo');addT(P.fone,'Planilha','pessoal');addT(P.fone_com,'Planilha','comercial');addT(P.fone_ref,'Planilha','referência');
  const em=[],je=new Set();const addE=(v,o)=>String(v||'').split(/[,;\s]+/).forEach(x=>{x=x.trim().toLowerCase();if(!x.includes('@')||je.has(x))return;je.add(x);em.push({v:x,o})});
  addE(M.email,'Editado');addE(A.email,'Asaas');addE(A.additionalEmails,'Asaas');addE(P.email,'Planilha');
  const eA=A.address?[A.address,A.addressNumber,A.complement,A.province,[A.cityName,A.state].filter(Boolean).join('/'),A.postalCode?'CEP '+A.postalCode:''].filter(x=>x&&String(x).trim()).join(', '):'';
  const eP=P.logradouro?[P.logradouro,P.numero,P.complemento,P.bairro,[P.cidade,P.uf].filter(Boolean).join('/'),P.cep?'CEP '+P.cep:''].filter(x=>x&&String(x).trim()&&x!=='0'&&x!==0).join(', '):'';
  const end=[];if(M.endereco)end.push({v:M.endereco,o:'Editado'});if(eA)end.push({v:eA,o:'Asaas'});if(eP&&(!eA||!digs(eA).includes(digs(P.cep))))end.push({v:eP,o:'Planilha'});
  return{nome:nome(c.nome||A.name||P.nome),cpf:cpfF(c.cpf||A.cpfCnpj||P.cpf),tel,em,end,P,A,M}}
const orgT=o=>`<span class="org ${o==='Planilha'?'pl':o==='Editado'?'mn':''}">${o}</span>`;
async function telaClientes(){app.innerHTML='<div class="card">Carregando…</div>';CLI=await api('clientes');desenhaClientes()}
function desenhaClientes(){
  const q=CLIQ.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(),qd=digs(CLIQ);
  const L=CLI.map(c=>({c,d:cliDados(c)})).filter(({c,d})=>{
    if(CLIF==='ativos'&&!c.contratos.some(k=>k.atual))return false;
    if(CLIF==='semtel'&&d.tel.length)return false;
    if(!q)return true;const t=(d.nome+' '+d.em.map(x=>x.v).join(' ')).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    return t.includes(q)||(qd.length>=3&&(digs(d.cpf).includes(qd)||d.tel.some(x=>digs(x.v).includes(qd))||c.contratos.some(k=>k.numero.includes(qd.padStart(4,'0'))||k.numero===qd.padStart(4,'0'))))});
  const at=CLI.filter(c=>c.contratos.some(k=>k.atual)).length;

/* ---------- CONTRATO: cálculos ---------- */
/* correção é UMA por ano, lançada na mensal de janeiro; as anuais herdam o mesmo percentual de todas as correções lançadas antes do vencimento delas */
function fatoresMensais(){const ms=C.correcoes.filter(c=>c.grupo==='mensal').sort((a,b)=>a.a_partir-b.a_partir);
  const base=Math.min(...C.titulos.filter(t=>t.grupo==='mensal'&&!t.conferente).map(t=>+t.valor_face).filter(v=>v>0));let prev=base;const out=[];
  for(const k of ms){const t=C.titulos.find(x=>x.grupo==='mensal'&&!x.conferente&&+x.numero===+k.a_partir);const data=t?.vencimento||k.data;const nv=+k.novo_valor;
    if(!/^Diluição/.test(k.obs||'')&&prev>0)out.push({data,f:nv/prev});prev=nv}return out}
function acrDil(t){let a=0;for(const e of C.eventos||[])if(e.tipo==='repactuacao'&&e.dados?.subtipo==='diluicao')for(const i of e.dados.itens||[])if(+i.titulo_id===+t.id)a+=+i.valor||0;return a}
function valorAno(t){const v0=valorAno0(t);const a=acrDil(t);return a?Math.round((v0+a)*100)/100:v0}
function valorAno0(t){
  if(t.grupo!=='mensal'&&t.grupo!=='anual')return Number(t.valor_face||0);
  if(t.grupo==='anual'){const pgA=C.pagamentos.find(p=>p.titulo_id==t.id&&+p.valor_cobranca>0);if(pgA&&t.vencimento<=C.hoje)return +pgA.valor_cobranca;}
  if(t.grupo==='anual'){/* histórico: vale o que já foi cobrado (correção de anual registrada); daqui pra frente, herda as correções de janeiro posteriores */
    const cs=C.correcoes.filter(c=>c.grupo==='anual'&&!/^Diluição/.test(c.obs||'')&&+c.a_partir<=+t.numero).sort((a,b)=>a.a_partir-b.a_partir);let v=Number(t.valor_face||0),desde='';
    if(cs.length){const k=cs[cs.length-1];v=+k.novo_valor;const ta=C.titulos.find(x=>x.grupo==='anual'&&!x.conferente&&+x.numero===+k.a_partir);desde=k.data||ta?.vencimento||''}
    for(const x of fatoresMensais())if(x.data&&t.vencimento&&x.data>desde&&x.data<=t.vencimento&&!(desde&&x.data.slice(0,4)===desde.slice(0,4)))v*=x.f;
    const semA=anosSemAsaas();if(semA.includes(+String(t.vencimento).slice(0,4)))for(const y of semA){const dj=`${y}-01-01`;if(dj>desde&&t.vencimento&&dj<=t.vencimento&&!(desde&&String(y)===desde.slice(0,4)))v*=FATOR_ANO[y]}return Math.round(v*100)/100}
  const cs=C.correcoes.filter(c=>c.grupo===t.grupo&&c.a_partir<=t.numero).sort((a,b)=>a.a_partir-b.a_partir);
  let v=cs.length?Number(cs[cs.length-1].novo_valor):Number(t.valor_face||0);
  const k=cs[cs.length-1],tk=k&&C.titulos.find(x=>x.grupo==='mensal'&&!x.conferente&&+x.numero===+k.a_partir),desde=k?(tk?.vencimento||k.data||''):'';
  /* correção de janeiro que não foi lançada: se o cliente vem pagando no ano, fica o valor que ele paga (compensa no janeiro seguinte); parcela de ano em que ele não pagou nada leva a correção */
  const semA=anosSemAsaas();if(semA.includes(+String(t.vencimento).slice(0,4)))for(const y of semA){const dj=`${y}-01-01`;if(dj>desde&&t.vencimento&&dj<=t.vencimento)v*=FATOR_ANO[y]}
  return Math.round(v*100)/100;
}
/* ano em que o Asaas não emitiu nada (boletos excluídos de quem está atrasado): a correção de 1º de janeiro entra pela tabela do ano,
   em todas as parcelas que vencem dali pra frente */
function anosSemAsaas(){const fm=fatoresMensais(),m0=C.titulos.find(x=>x.grupo==='mensal'&&!x.conferente);
  const y0=+String(C.contrato.data_assinatura||m0?.vencimento||'2000').slice(0,4),com=new Set(fm.map(x=>+String(x.data).slice(0,4)));
  for(const p of C.pagamentos){const t=C.titulos.find(x=>x.id==p.titulo_id);if(t&&(t.grupo==='mensal'||t.grupo==='anual')&&t.vencimento)com.add(+t.vencimento.slice(0,4))}
  return Object.keys(FATOR_ANO).map(Number).filter(y=>y>y0&&!com.has(y))}
function pascoa(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;return new Date(Date.UTC(y,mes-1,dia))}
const FERIADOS={};function feriados(y){if(FERIADOS[y])return FERIADOS[y];const f=new Set(['01-01','04-21','05-01','09-07','10-12','11-02','11-15','11-20','12-25'].map(x=>y+'-'+x));const p=pascoa(y);for(const d of [-48,-47,-2,60]){const x=new Date(p);x.setUTCDate(x.getUTCDate()+d);f.add(x.toISOString().slice(0,10))}return FERIADOS[y]=f}
/* vencimento em fim de semana ou feriado nacional passa para o próximo dia útil */
function proxUtil(iso){if(!iso)return iso;const d=new Date(String(iso).slice(0,10)+'T12:00:00Z');for(;;){const s=d.toISOString().slice(0,10),w=d.getUTCDay();if(w!==0&&w!==6&&!feriados(d.getUTCFullYear()).has(s))return s;d.setUTCDate(d.getUTCDate()+1)}}
function diasUteisDepois(venc,pago){const v=proxUtil(venc);return Math.max(0,Math.round((new Date(String(pago).slice(0,10))-new Date(v))/864e5))}
function estado(t){
  if(tituloSegVia(t))return 'cancelada';
  const hoje=C.hoje, pags=C.pagamentos.filter(p=>p.titulo_id==t.id), sit=C.situacoes.find(s=>s.titulo_id==t.id);

async function botaoCob(){if(!(EU==='luis'||EU==='assistente')||COMO||document.documentElement.classList.contains('embed'))return;const n=C.contrato.numero,ac=document.querySelector('.acoes');if(!ac)return;

  const b=document.createElement('button');if(c){b.textContent='Em cobrança — ver o caso';b.style.cssText='background:#fee2e2;color:#991b1b;border-color:#fca5a5';b.onclick=()=>location.hash='cob/'+c.id}
  else if(atr){b.textContent='Enviar para cobrança';b.onclick=()=>enviaCob(n)}else return;ac.prepend(b)}

function verAcordo(id){const a=C.acordos.find(x=>x.id==id),T=C.titulos;const orig=(a.titulos_origem||[]).map(i=>T.find(t=>t.id==i)?.rotulo||'?').join(', ');
  abreModal(`<div class="bt" style="align-items:center"><h3 style="flex:1">${nomeAc(a)} — de ${dbr(a.data_acordo)} — ${brl(a.valor_acordado)}${a.termo?' — Termo nº '+esc(a.termo):''}</h3><button onclick="fechaModal()">Fechar</button></div>
  <div><b>Englobou:</b> ${esc(orig)}</div><div class="mut" style="margin:6px 0">Principal ${brl(a.principal)} · Multa ${brl(a.multa)} · Juros ${brl(a.juros)} · Custo de cobrança ${brl(a.honorarios)} · ${a.qtd_parcelas} parcela(s)</div>

const IGPM_ANO={2023:0,2024:0,2025:6.54,2026:0};
function pctCorr(k){const ks=C.correcoes.filter(x=>x.grupo===k.grupo&&+x.a_partir<+k.a_partir).sort((a,b)=>a.a_partir-b.a_partir);
  const base=ks.length?+ks[ks.length-1].novo_valor:Math.min(...C.titulos.filter(t=>t.grupo===k.grupo&&!t.conferente).map(t=>+t.valor_face).filter(v=>v>0));
  const tot=base>0?(+k.novo_valor/base-1)*100:null;const t=C.titulos.find(t=>t.grupo===k.grupo&&+t.numero===+k.a_partir&&!t.conferente);
  const ano=+String(k.data||t?.vencimento||'').slice(0,4);const ig=IGPM_ANO[ano]!=null?IGPM_ANO[ano]:(k.igpm_pct!=null&&k.igpm_pct!==''?+k.igpm_pct:null);
  const ju=tot!=null&&ig!=null?tot-ig:(k.juros_pct!=null&&k.juros_pct!==''?+k.juros_pct:null);return {base,tot,ig,ju}}

function calcEncargos(){
  const cob=numBR($('#f_valor_cobranca').value),pago=numBR($('#f_valor_pago').value);if(cob==null||pago==null)return;

  let dif=r2(pago-cob),mu=0,ju=0,ho=0,de=0,msg='';
  if(dif<0)de=-dif;
  else if(dif>0&&dias>0){mu=Math.min(dif,r2(cob*.02));const jEsp=r2(cob*(Math.pow(1.01,dias/30)-1));ju=Math.min(r2(dif-mu),jEsp);ho=r2(dif-mu-ju)}

/* valores para devolução (distrato): pago − multa − corretagem − retenção sobre o restante */
function pagoDevolucao(){const ls=[];for(const p of C.pagamentos){const t=C.titulos.find(x=>x.id==p.titulo_id);if(!t)continue;let l=(+p.valor_pago||0)-(+p.multa_paga||0)-(+p.juros_pago||0)-(+p.honorarios_pago||0);
  if(t.grupo==='acordo'){const a=C.acordos.find(a=>a.id==t.acordo_id);if(a)l*=partesAcordo(a).pr}ls.push({t,p,v:r2(l),d:String(p.confirmada_em||t.vencimento||'').slice(0,10)})}
  return ls.sort((a,b)=>a.d.localeCompare(b.d))}
function calcDevolucao(D){const multa=r2(D.pago*D.pm/100),base=r2(D.pago-multa-D.corr),ret=r2((D.modo==='pago'?D.pago:Math.max(0,base))*D.pr/100),dev=r2(Math.max(0,base-ret));
  const n=Math.max(1,D.n|0),b=r2(Math.floor(dev/n*100)/100),ps=[];const [y,m]=String(D.venc).split('-').map(Number);
  for(let i=0;i<n;i++){const dt=new Date(Date.UTC(y,m-1+i,1)),dd=String(D.venc).slice(8,10)||'15';ps.push({n:i+1,venc:dt.toISOString().slice(0,7)+'-'+dd,v:i<n-1?b:r2(dev-b*(n-1))})}
  return{multa,base,ret,dev,ps}}
function modalDevolucao(){const ls=pagoDevolucao(),pago=r2(ls.reduce((a,x)=>a+x.v,0)),meses=new Set(ls.map(x=>x.d.slice(0,7))).size;
  const enc=C.eventos.filter(e=>e.tipo==='encerramento').sort((a,b)=>String(b.data).localeCompare(String(a.data)))[0];
  const h=new Date(C.hoje+'T12:00:00');h.setMonth(h.getMonth()+1);const venc=h.toISOString().slice(0,7)+'-15';
  abreModal(`<div class="bt" style="align-items:center"><h3 style="flex:1">Valores para devolução</h3><button onclick="fechaModal()">Fechar</button></div>
  <div class="info">Regra usada hoje: do valor pago (sem multa, juros e custo de cobrança) sai a multa de 20% e a corretagem; do que sobra, retém 10%. O restante é devolvido em parcelas mensais, no dia 15. Todos os campos podem ser alterados.</div>
  <div class="f2"><div><label>Valor pago pelo cliente (${ls.length} pagamentos)</label><input id="dv_pg" inputmode="decimal" value="${brl(pago)}"></div>
  <div><label>Corretagem</label><input id="dv_co" inputmode="decimal" value="${brl(+C.contrato.corretagem||0)}"></div>
  <div><label>Multa (%)</label><input id="dv_pm" inputmode="decimal" value="20"></div>
  <div><label>Retenção (%)</label><input id="dv_pr" inputmode="decimal" value="10"></div>
  <div><label>Retenção calculada sobre</label><select id="dv_md"><option value="resto">O que sobra depois da multa e da corretagem (regra atual)</option><option value="pago">O valor pago (como está no contrato)</option></select></div>
  <div><label>Data do distrato</label><input id="dv_dt" type="date" value="${String(enc?.data||C.hoje).slice(0,10)}"></div>
  <div><label>Nº de parcelas da devolução</label><input id="dv_n" inputmode="numeric" value="${meses||1}"></div>
  <div><label>1º vencimento da devolução</label><input id="dv_vc" type="date" value="${venc}"></div></div>
  <div class="mut" style="margin-top:4px">Sugestão de parcelas: ${meses} (meses em que o cliente pagou).</div>
  <div id="dv_res" style="margin-top:10px"></div>
  <div class="bt"><button class="pri" onclick="relatorio('devolucao')">Imprimir / salvar em PDF</button></div>`);
  const le=()=>({pago:numBR($('#dv_pg').value)||0,corr:numBR($('#dv_co').value)||0,pm:numBR($('#dv_pm').value)||0,pr:numBR($('#dv_pr').value)||0,modo:$('#dv_md').value,data:$('#dv_dt').value,n:Number($('#dv_n').value)||1,venc:$('#dv_vc').value||venc,ls});
  const at=()=>{const D=le(),R=calcDevolucao(D);window._DEV={...D,...R};
    $('#dv_res').innerHTML=`<table><tbody><tr><td>Valor pago</td><td class="n">${brl(D.pago)}</td></tr><tr><td>(−) Multa de ${D.pm}%</td><td class="n">${brl(R.multa)}</td></tr><tr><td>(−) Corretagem</td><td class="n">${brl(D.corr)}</td></tr><tr><td>(−) Retenção de ${D.pr}%</td><td class="n">${brl(R.ret)}</td></tr><tr><td><b>Valor a devolver</b></td><td class="n"><b>${brl(R.dev)}</b></td></tr><tr><td>Total descontado</td><td class="n">${brl(r2(D.pago-R.dev))}</td></tr></tbody></table>
    <div style="margin-top:6px">${R.dev?`<b>${R.ps.length}</b> parcela${R.ps.length>1?'s':''} de <b>${brl(R.ps[0].v)}</b>${R.ps.length>1&&R.ps.at(-1).v!==R.ps[0].v?' (última de '+brl(R.ps.at(-1).v)+')':''}, de ${dbr(R.ps[0].venc)} a ${dbr(R.ps.at(-1).venc)}`:'<b>Nada a devolver:</b> os descontos passam do valor pago.'}</div>`};
  document.querySelectorAll('#modal input,#modal select').forEach(x=>{x.oninput=at;x.onchange=at});at()}

/* diluição da dívida: parte do que o cliente devia foi somada às parcelas a vencer (não gera parcelas novas, só aumenta o valor delas) */
function modalDiluicao(eid){const e=eid?C.eventos.find(x=>x.id==eid):null,d=e?.dados||{};const ja={};(d.itens||[]).forEach(i=>ja[i.titulo_id]=i.valor);
  const ts=C.titulos.filter(t=>(t.grupo==='mensal'||t.grupo==='anual')&&!t.conferente&&estado(t)!=='cancelada').sort((a,b)=>String(a.vencimento).localeCompare(String(b.vencimento)));
  abreModal(`<div class="bt" style="align-items:center"><h3 style="flex:1">Diluir dívida nas parcelas a vencer${e?' — editar':''}</h3><button onclick="fechaModal()">Fechar</button></div>
  <div class="info">Parte do que o cliente devia foi somada às parcelas a vencer. Não cria parcelas: só aumenta o valor das escolhidas.</div>
  <div class="f2"><div><label>Data</label><input id="g_d" type="date" value="${e?.data?String(e.data).slice(0,10):''}"></div>
  <div><label>Quanto devia na data</label><input id="g_dv" inputmode="decimal" value="${d.devia!=null?brl(d.devia):''}"></div>
  <div><label>Quanto pagou à vista</label><input id="g_pg" inputmode="decimal" value="${d.pago!=null?brl(d.pago):''}"></div>
  <div><label>Valor diluído</label><input id="g_tot" inputmode="decimal" value="${d.total!=null?brl(d.total):''}"></div></div>
  <div class="bt" style="margin-top:6px"><button onclick="window._gDiv()">Dividir igual nas marcadas</button></div>
  <div style="max-height:280px;overflow:auto;margin-top:6px">${ts.map(t=>`<div class="f2" style="align-items:center"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" class="g_ck" data-id="${t.id}" ${ja[t.id]!=null?'checked':''}> ${esc(codTit(t))} — ${dbr(t.vencimento)} — ${brl(valorAno0(t))}</label><input class="g_v" data-id="${t.id}" inputmode="decimal" placeholder="acréscimo" value="${ja[t.id]!=null?brl(ja[t.id]):''}"></div>`).join('')}</div>
  <div id="g_soma" class="mut"></div>
  <label style="margin-top:8px">Observação</label><input id="g_o" value="${esc(e?.obs||'')}">
  <div class="bt"><button class="pri" onclick="salvaDiluicao(${eid||'null'})">Salvar</button></div>`);
  const soma=()=>{const s=r2([...document.querySelectorAll('.g_ck:checked')].reduce((a,c)=>a+(numBR(document.querySelector('.g_v[data-id="'+c.dataset.id+'"]').value)||0),0));$('#g_soma').textContent='Soma dos acréscimos: '+brl(s)};
  window._gDiv=()=>{const ck=[...document.querySelectorAll('.g_ck:checked')],tot=numBR($('#g_tot').value)||0;if(!ck.length)return alert('Marque as parcelas.');const b=r2(Math.floor(tot/ck.length*100)/100);ck.forEach((c,i)=>{document.querySelector('.g_v[data-id="'+c.dataset.id+'"]').value=brl(i<ck.length-1?b:r2(tot-b*(ck.length-1)))});soma()};
  document.querySelectorAll('.g_v,.g_ck').forEach(x=>x.oninput=soma);soma()}
async function salvaDiluicao(eid){const itens=[...document.querySelectorAll('.g_ck:checked')].map(c=>({titulo_id:+c.dataset.id,valor:numBR(document.querySelector('.g_v[data-id="'+c.dataset.id+'"]').value)||0})).filter(i=>i.valor);
  if(!itens.length)return alert('Informe os acréscimos das parcelas.');const total=r2(itens.reduce((a,i)=>a+i.valor,0));const old=eid?C.eventos.find(x=>x.id==eid)?.dados||{}:{};
  const dados={...old,subtipo:'diluicao',total,devia:numBR($('#g_dv').value),pago:numBR($('#g_pg').value),itens};
  const body={contrato:C.contrato.numero,tipo:'repactuacao',motivo:'Diluição da dívida',a_partir_titulo:itens[0].titulo_id,data:$('#g_d').value||null,dados,obs:$('#g_o').value};
  await api(eid?'evento/'+eid:'evento',{method:eid?'PUT':'POST',body});fechaModal();recarrega()}
/* repactuação: parcela dividida em vários boletos antes de atrasar */
function modalRepact(){
  const ops=C.titulos.filter(t=>t.grupo!=='acordo'&&!C.pagamentos.some(p=>p.titulo_id==t.id)&&!acordoDe(t)&&estado(t)!=='cancelada').map(t=>`<option value="${t.id}">${esc(t.rotulo)} — ${dbr(t.vencimento)} — ${brl(valorAno(t))}</option>`).join('');
  abreModal(`<div class="bt" style="align-items:center"><h3 style="flex:1">Repactuação (parcelamento sem atraso)</h3><button onclick="fechaModal()">Fechar</button></div>
  <div class="info">O cliente pediu, antes de atrasar, para dividir uma parcela em vários boletos. A parcela original sai como quitada pela repactuação e os boletos novos aparecem na seção Repactuações. Não tem multa nem juros.</div>
  <div class="f2"><div><label>Parcela repactuada</label><select id="r_t">${ops}</select></div>
  <div><label>Data da repactuação</label><input id="r_d" type="date"></div>
  <div><label>Dividida em quantos boletos</label><input id="r_n" inputmode="numeric" value="3"></div></div>
  <div id="r_bol" style="margin-top:8px"></div>
  <label style="margin-top:8px">Observação</label><input id="r_o">
  <div class="bt"><button class="pri" onclick="salvaRepact()">Salvar</button></div>`);
  const monta=()=>{const t=C.titulos.find(x=>x.id==$('#r_t').value);if(!t)return;const n=Math.max(1,Math.min(24,parseInt($('#r_n').value)||1)),v=valorAno(t),b=r2(Math.floor(v/n*100)/100);
    let h='<div class="mut" style="font-weight:600;color:var(--tx)">Boletos</div>';for(let i=0;i<n;i++){const d=new Date(String(t.vencimento).slice(0,10)+'T12:00:00Z');d.setUTCMonth(d.getUTCMonth()+i);const val=i<n-1?b:r2(v-b*(n-1));
      h+=`<div class="f2"><div><label>Boleto ${i+1} — vencimento</label><input class="r_v" type="date" value="${d.toISOString().slice(0,10)}"></div><div><label>Valor</label><input class="r_val" inputmode="decimal" value="${brl(val)}"></div></div>`}
    $('#r_bol').innerHTML=h;if(!$('#r_d').value)$('#r_d').value=String(t.vencimento).slice(0,10)};
  $('#r_t').onchange=monta;$('#r_n').oninput=monta;monta();
}
async function salvaRepact(){const t=C.titulos.find(x=>x.id==$('#r_t').value);if(!t)return alert('Escolha a parcela.');
  const vs=[...document.querySelectorAll('.r_v')].map(e=>e.value),vals=[...document.querySelectorAll('.r_val')].map(e=>numBR(e.value));
  if(vs.some(x=>!x)||vals.some(x=>!x))return alert('Preencha vencimento e valor de todos os boletos.');
  const tot=r2(vals.reduce((a,b)=>a+b,0));
  await api('acordo',{method:'POST',body:{tipo:'repactuacao',contrato:C.contrato.numero,data_acordo:$('#r_d').value||t.vencimento,titulos_origem:[+t.id],principal:tot,multa:0,juros:0,honorarios:0,valor_calculado:tot,valor_acordado:tot,desconto_encargos:0,parcelas:vs.map((v,i)=>({vencimento:v,valor:vals[i]})),obs:$('#r_o').value}});
  fechaModal();recarrega()}

/* ---------- CRUZAMENTO (só administrador) ---------- */
const NOMECONF={luis:'Luis',secretaria:'Secretária',legado:'Banco antigo',final:'Final'};
async function telaCruzamento(todos){
  app.innerHTML='<div class="card">Comparando as conferências…</div>';
  const L=await api('cruzamento'+(todos?'?todos=1':''));
  const pend=L.filter(c=>c.pendentes).length,res=L.filter(c=>c.resolvido).length;
  app.innerHTML=`<div class="card"><div class="bt" style="align-items:center"><h3 style="margin:0;flex:1">Cruzamento das conferências</h3>
   <span class="tag al">${pend} com divergência pendente</span><span class="tag ok">${res} resolvidos</span>
   <label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" style="width:auto" ${todos?'checked':''} onchange="telaCruzamento(this.checked)"> mostrar todos (não só os fechados pelos dois)</label></div>
   <div class="mut" style="margin-top:6px">Aparecem os contratos já fechados pela sua conferência e pela da secretária. Verde = tudo igual. Amarelo = tem divergência para decidir.</div></div>
   <div class="cgrid">${L.map(c=>`<button class="cb ${c.resolvido||!c.pendentes?'fech':'alt'}" onclick="location.hash='x/${c.numero}'">
    <div class="cbt"><b>${c.numero}</b><span>Q${c.quadra} L${c.lote}</span></div><div class="cbn">${esc(nome(c.titular))}</div>
    <div class="mut">Comparando: ${c.confs.map(x=>NOMECONF[x]).join(' × ')||'—'}</div>
    <div>${c.divergencias?`<span class="tag al">${c.pendentes} de ${c.divergencias} divergência(s) pendentes</span>`:'<span class="tag ok">Tudo igual</span>'} ${c.resolvido?'<span class="tag ok">Resolvido</span>':''}</div></button>`).join('')||'<div class="card">Nenhum contrato fechado pelos dois ainda.</div>'}</div>`;
}
async function cruzContrato(n){
  app.innerHTML='<div class="card">Carregando…</div>';
  X=await api('cruzamento/'+n);X.n=n;desenhaCruz();
}
function desenhaCruz(){
  const T=X.titulos,ct=X.dados.final.contrato||X.dados[X.confs[0]]?.contrato;
  const b=t=>{const cls=t.decidido?'cancelada':t.diverge?'vencida':'paga';
    return `<button class="pc ${cls} ${t.grupo==='anual'?'anual':''}" title="${esc(t.rotulo)}" onclick="cruzTitulo(${t.id})"><b>${t.grupo==='mensal'?'M':t.grupo==='anual'?'A':t.grupo==='entrada'?'E':'P'} ${t.numero}</b><small>${dbr(t.vencimento).slice(0,5)}${t.vencimento?'/'+t.vencimento.slice(2,4):''}</small><small>${t.decidido?'decidido':t.diverge?'DIVERGE':'igual'}</small></button>`};
  const ent=T.filter(t=>t.grupo==='entrada'),men=T.filter(t=>t.grupo==='mensal'),anu=T.filter(t=>t.grupo==='anual'),out=T.filter(t=>t.grupo==='outra');
  let lin='';if(ent.length)lin+=`<div class="lin"><span class="rot">Entrada</span>${ent.map(b).join('')}</div>`;
  for(let a=0;a<Math.max(Math.ceil(men.length/12),anu.length);a++)lin+=`<div class="lin"><span class="rot">Ano ${a+1}</span>${men.slice(a*12,a*12+12).map(b).join('')}${anu[a]?'<span style="width:10px"></span>'+b(anu[a]):''}</div>`;
  if(out.length)lin+=`<div class="lin"><span class="rot">Outras</span>${out.map(b).join('')}</div>`;
  const NS={acordos:'Acordos',correcoes:'Correções',eventos:'Encerramento e cessão'};
  const sec=X.secoes.map(s=>`<div class="card" style="margin:8px 0;border-left:5px solid ${s.decidido?'var(--ca)':s.diverge?'var(--ve)':'var(--pg)'}">
   <div class="bt" style="align-items:center"><b style="flex:1">${NS[s.secao]}</b>${s.decidido?`<span class="tag">decidido: ${esc(NOMECONF[s.decidido.de]||s.decidido.de)}</span>`:s.diverge?'<span class="tag al">DIVERGE</span>':'<span class="tag ok">igual</span>'}</div>
   <table><tbody>${X.confs.map(c=>`<tr><td style="width:130px"><b>${NOMECONF[c]}</b></td><td>${esc(s.sig[c]||'(nada lançado)')}</td><td style="width:150px">${s.diverge?`<button onclick="cruzUsar('secao','${s.secao}','${c}')">Usar esta versão</button>`:''}</td></tr>`).join('')}</tbody></table></div>`).join('');
  const nd=T.filter(t=>t.diverge).length+X.secoes.filter(s=>s.diverge).length,np=T.filter(t=>t.diverge&&!t.decidido).length+X.secoes.filter(s=>s.diverge&&!s.decidido).length;
  app.innerHTML=`<div class="bt" style="margin-bottom:10px"><button onclick="location.hash='x'">← Cruzamento</button></div>
  <div class="card"><h2 style="margin:0">Cruzamento · Contrato ${X.n} · Q${ct?.quadra} L${ct?.lote}</h2>
   <div class="mut">Comparando: ${X.confs.map(c=>NOMECONF[c]).join(' × ')} · ${nd} divergência(s), ${np} pendente(s)</div>
   ${X.dados.final.fechamento?`<div class="info">Contrato marcado como RESOLVIDO em ${new Date(X.dados.final.fechamento.fechado_em).toLocaleString('pt-BR')}</div>`:''}
   <div class="bt" style="margin-top:10px"><button class="pri" onclick="cruzAcao('aceitar_iguais')">Aceitar tudo que bate</button>
    <button onclick="location.hash='f/${X.n}'">Abrir versão final para editar</button><span style="flex:1"></span>
    ${X.dados.final.fechamento?`<button onclick="cruzAcao('reabrir')">Reabrir</button>`:`<button class="pri" onclick="cruzResolver(${np})">Marcar contrato resolvido</button>`}</div></div>
  <div class="card"><div class="leg"><span style="--c:var(--pg)">Igual nas conferências</span><span style="--c:var(--ve)">Diverge (clique para decidir)</span><span style="--c:var(--ca)">Já decidido</span></div><br>
   <div class="grid">${lin}</div></div><div class="card">${sec}</div>`;
}
function cruzTitulo(id){
  const t=X.titulos.find(x=>x.id==id);
  const col=c=>{const D=X.dados[c],pg=D.pagamentos.filter(p=>p.titulo_id==id),sit=D.situacoes.find(s=>s.titulo_id==id),est=(t.sig[c]||'').split('|')[0];
    return `<div class="card" style="flex:1;min-width:220px;margin:0"><h4 style="margin:0 0 6px">${NOMECONF[c]}</h4><div><b>${NOMES[est]||est}</b></div>
     ${sit?.obs?`<div class="mut">Obs.: ${esc(sit.obs)}</div>`:''}
     ${pg.map(p=>`<div class="pgl" style="display:block"><b>${brl(p.valor_pago)}</b> · entrou ${dbr(p.confirmada_em)}<br>fatura ${esc(p.fatura||'—')} · ${esc(p.forma||'')}<br><span class="mut">${esc((p.descricao||'').slice(0,160))}</span>${p.tem_print?`<br><button onclick="verPrintDe(${p.id},'${c}')">Ver print</button>`:''}</div>`).join('')||'<div class="mut">Nenhum pagamento lançado</div>'}
     <button class="pri" style="margin-top:8px" onclick="cruzUsar('titulo',${id},'${c}')">Usar esta versão</button></div>`};
  abreModal(`<div class="bt" style="align-items:center"><h3 style="flex:1">${esc(t.rotulo)} — vence ${dbr(t.vencimento)}</h3><button onclick="fechaModal()">Fechar</button></div>
   ${t.decidido?`<div class="info">Decidido: versão ${esc(NOMECONF[t.decidido.de]||t.decidido.de)} em ${new Date(t.decidido.em).toLocaleString('pt-BR')}</div>`:''}
   <div class="bt" style="align-items:stretch">${X.confs.map(col).join('')}</div>
   <div class="mut" style="margin-top:8px">Se nenhuma estiver certa, use "Abrir versão final para editar" e corrija direto na versão final.</div>`);
}
async function verPrintDe(id,c){const antes=COMO;COMO=c==='final'?'final':'';try{const d=await api('print/'+id);if(!d.conteudo)return alert('Print não disponível para a conferência de outra pessoa.');const w=window.open('');w.document.write(`<img src="${d.conteudo}" style="max-width:100%">`)}finally{COMO=antes}}
async function cruzUsar(tipo,alvo,de){
  await api('cruzamento/'+X.n,{method:'POST',body:tipo==='titulo'?{acao:'titulo',titulo_id:alvo,de}:{acao:'secao',secao:alvo,de}});
  fechaModal();cruzContrato(X.n);
}
async function cruzAcao(acao){await api('cruzamento/'+X.n,{method:'POST',body:{acao}});cruzContrato(X.n)}
async function cruzResolver(np){if(np&&!confirm(`Ainda há ${np} divergência(s) sem decisão. Marcar resolvido mesmo assim?`))return;cruzAcao('resolver')}

iniciar();
</script>
</body>
</html>
