<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conferência Beira Rio</title>
<link rel="icon" href="logo.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#16181d;--mut:#6b7280;--ln:#e3e6eb;--az:#29c5f6;--azd:#0b8fbf;
--pg:#16a34a;--ac:#eab308;--ca:#3b82f6;--at:#b91c1c;--ve:#ef4444;--fu:#d1d5db;--pa:#6fbf8a}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;align-items:center;gap:12px;padding:10px 20px;background:#111;color:#fff;position:sticky;top:0;z-index:5}
header img{height:30px;background:#fff;border-radius:6px;padding:2px}header b{font-size:16px}header .sp{flex:1}
header button{background:transparent;color:#fff;border:1px solid #444}
main{max-width:1250px;margin:0 auto;padding:18px}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:#fff;border-radius:7px;padding:7px 12px}
button.pri{background:var(--az);border-color:var(--az);color:#00202d;font-weight:600}button.pri:hover{background:var(--azd);color:#fff}
button.per{color:var(--at);border-color:#f3c1c1}button:disabled{opacity:.45;cursor:default}
input,select,textarea{font:inherit;border:1px solid var(--ln);border-radius:7px;padding:7px 9px;width:100%;background:#fff}
textarea{min-height:70px}label{font-size:12px;color:var(--mut);display:block;margin:0 0 3px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:14px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln)}
th{font-size:12px;color:var(--mut);font-weight:600}tr.lk{cursor:pointer}tr.lk:hover{background:#f0fbff}
.bar{height:8px;background:#eee;border-radius:9px;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:var(--pg)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#eef2f7}
.tag.ok{background:#dcfce7;color:#14532d}.tag.al{background:#fef3c7;color:#78350f}
.grid{display:flex;flex-direction:column;gap:8px}.lin{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lin .rot{width:78px;font-size:12px;color:var(--mut)}
.pc{width:74px;height:50px;border-radius:8px;border:2px solid transparent;font-size:11px;line-height:1.15;padding:3px;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative}
.pc small{font-size:10px;opacity:.9}
.pc.paga{background:var(--pg)}.pc.paga_atraso{background:var(--pa);color:#0f3d1f}.pc.quitada_acordo{background:var(--ac);color:#3a2c00}.pc.em_acordo{background:#fff;color:#3a2c00;border-color:var(--ac)}
.pc.cancelada{background:var(--ca)}.pc.em_atraso{background:var(--at)}.pc.vencida{background:var(--ve)}.pc.futura{background:var(--fu);color:#333}
.pc.anual{outline:2px dashed #333;outline-offset:1px}.pc.sel{box-shadow:0 0 0 3px #111}
.pc .cf{position:absolute;top:2px;right:4px;font-size:10px}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mut)}.leg span:before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px;background:var(--c)}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.tot div{background:#f8fafc;border:1px solid var(--ln);border-radius:9px;padding:9px}
.tot b{display:block;font-size:17px}.tot .neg b{color:var(--at)}
.bt{display:flex;flex-wrap:wrap;gap:8px}
details{border:1px solid var(--ln);border-radius:10px;padding:10px 12px;margin-top:10px;background:#fff}summary{cursor:pointer;font-weight:600}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:20}
.modal .card{width:min(860px,100%);margin:0}.modal h3{margin:0 0 10px}
.drop{border:2px dashed #9bdcf3;border-radius:10px;padding:14px;text-align:center;color:var(--mut);background:#f3fbfe;cursor:pointer}
.drop img{max-width:100%;max-height:260px;margin-top:8px;border-radius:6px}
.aviso{background:#fef2f2;color:#7f1d1d;border:1px solid #fecaca;border-radius:8px;padding:8px 10px;margin:8px 0}
.info{background:#f0f9ff;color:#0c4a6e;border:1px solid #bae6fd;border-radius:8px;padding:8px 10px;margin:8px 0}
.mut{color:var(--mut);font-size:12px}.r{text-align:right}.hid{display:none}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.cb{text-align:left;background:#fff;border:1px solid var(--ln);border-left:5px solid var(--fu);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:140px}
.cb:hover{border-color:var(--az);box-shadow:0 2px 10px rgba(0,0,0,.06)}.cb.alt{border-left-color:var(--ac)}.cb.fech{border-left-color:var(--pg)}
.cbt{display:flex;justify-content:space-between;align-items:baseline}.cbt b{font-size:20px}.cbt span{font-weight:600;color:var(--azd)}
.cbn{font-size:13px;line-height:1.25;min-height:32px}
.pc.ev{color:#fff}.evac{background:#a16207}.evco{background:#7c3aed}.evev{background:#334155}
.pgl{border:1px solid var(--ln);border-radius:8px;padding:8px;margin-bottom:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media(max-width:600px){main{padding:10px}.pc{width:62px}.lin .rot{width:100%}}
.ficha{border:1px solid var(--ln);border-left:5px solid #2e9e4f;border-radius:10px;padding:12px;margin-top:10px;background:rgba(46,158,79,.04)}
.dado{border:1px solid var(--ln);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:2px;background:var(--card)}
.dado span{font-size:12px;color:#777}.dado b{font-size:14px;word-break:break-word}
.desc{white-space:pre-wrap;word-break:break-word;border:1px solid var(--ln);border-radius:8px;padding:10px;background:var(--card);line-height:1.45}
#f_descricao{overflow:hidden;resize:vertical;min-height:80px}
</style>
</head>
<body>
<header><img src="logo.png" alt=""><b>Conferência Beira Rio</b><span class="sp"></span><span id="quem"></span><button id="sair" class="hid">Sair</button></header>
<main id="app"></main>
<div id="modal"></div>
<script>
const $=s=>document.querySelector(s), app=$('#app');
let PIN=''; try{PIN=localStorage.getItem('cbr_pin')||''}catch(e){}
let EU='', COMO='', LISTA=[], C=null, SEL=new Set(), SELMODO=false, X=null;
const brl=v=>v==null||isNaN(v)?'—':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dbr=d=>d?String(d).slice(0,10).split('-').reverse().join('/'):'—';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r2=v=>Math.round(v*100)/100;
async function api(path,opt={}){
  const r=await fetch('/api/'+path,{method:opt.method||'GET',headers:{'x-pin':PIN,'x-como':COMO,'content-type':'application/json'},body:opt.body?JSON.stringify(opt.body):undefined});
  const d=await r.json().catch(()=>({erro:'Resposta inválida'}));
  if(r.status===401){PIN='';try{localStorage.removeItem('cbr_pin')}catch(e){}telaLogin(d.erro||'Senha inválida');throw new Error('401')}
  if(!r.ok||d.erro){alert(d.erro||'Erro');throw new Error(d.erro)}
  return d;
}
function telaLogin(msg){
  $('#quem').textContent='';$('#sair').classList.add('hid');
  app.innerHTML=`<div class="card" style="max-width:380px;margin:60px auto"><h3>Entrar</h3>${msg?`<div class="aviso">${msg}</div>`:''}
  <label>Senha</label><input id="pin" type="password" autofocus><br><br><button class="pri" id="ent">Entrar</button></div>`;
  const go=async()=>{PIN=$('#pin').value.trim();try{localStorage.setItem('cbr_pin',PIN)}catch(e){};iniciar()};
  $('#ent').onclick=go;$('#pin').onkeydown=e=>{if(e.key==='Enter')go()};
}
async function iniciar(){
  if(!PIN)return telaLogin();
  try{const d=await api('eu');EU=d.conferente}catch(e){return}
  $('#quem').innerHTML=EU==='luis'?'<button onclick="location.hash=\'\'">Minha conferência</button> <button onclick="location.hash=\'x\'">Cruzamento</button>':'Conferência da Secretária';
  $('#sair').classList.remove('hid');$('#sair').onclick=()=>{PIN='';try{localStorage.removeItem('cbr_pin')}catch(e){};telaLogin()};
  route();
}
window.onhashchange=()=>route();
function route(){const h=location.hash.slice(1);COMO='';
  if(h.startsWith('f/')&&EU==='luis'){COMO='final';abrirContrato(h.slice(2))}
  else if(h==='x'&&EU==='luis')telaCruzamento();
  else if(h.startsWith('x/')&&EU==='luis')cruzContrato(h.slice(2));
  else if(h.startsWith('c/'))abrirContrato(h.slice(2));else telaLista()}

/* ---------- LISTA ---------- */
async function telaLista(){
  app.innerHTML='<div class="card">Carregando…</div>';
  LISTA=await api('contratos');
  const fech=LISTA.filter(c=>c.fechado_em).length;
  app.innerHTML=`<div class="card"><div class="bt" style="align-items:center"><h3 style="margin:0;flex:1">Contratos (${LISTA.length})</h3>
  <span class="tag ok">${fech} fechados</span><span class="tag">${LISTA.length-fech} abertos</span></div><br>
  <input id="bus" placeholder="Buscar por número, quadra/lote ou nome"></div><div class="cgrid" id="tb"></div>`;
  const desenha=()=>{const t=$('#bus').value.toLowerCase();
    $('#tb').innerHTML=LISTA.filter(c=>!t||(c.numero+' q'+c.quadra+' l'+c.lote+' q'+c.quadra+'l'+c.lote+' '+(c.titular||'')).toLowerCase().includes(t)).map(c=>{
      const pc=c.vencidas?Math.round(100*c.conferidas/c.vencidas):0;
      return `<button class="cb ${c.fechado_em?'fech':''} ${c.n_alertas?'alt':''}" onclick="location.hash='c/${c.numero}'">
      <div class="cbt"><b>${c.numero}</b><span>Q${c.quadra||'?'} L${c.lote||'?'}</span></div>
      <div class="cbn">${esc(c.titular)}</div>
      <div class="bar"><i style="width:${pc}%"></i></div><div class="mut">${c.conferidas}/${c.vencidas} vencidas conferidas</div>
      <div>${c.fechado_em?`<span class="tag ok">Fechado ${dbr(c.fechado_em)}</span>`:''} ${c.n_alertas?`<span class="tag al">${c.n_alertas} alerta(s)</span>`:''}</div></button>`}).join('')};
  $('#bus').oninput=desenha;desenha();
}

/* ---------- CONTRATO: cálculos ---------- */
function valorAno(t){
  if(t.grupo!=='mensal'&&t.grupo!=='anual')return Number(t.valor_face||0);
  const cs=C.correcoes.filter(c=>c.grupo===t.grupo&&c.a_partir<=t.numero).sort((a,b)=>a.a_partir-b.a_partir);
  return cs.length?Number(cs[cs.length-1].novo_valor):Number(t.valor_face||0);
}
function estado(t){
  const hoje=C.hoje, pags=C.pagamentos.filter(p=>p.titulo_id==t.id), sit=C.situacoes.find(s=>s.titulo_id==t.id);
  const enc=C.eventos.find(e=>e.tipo==='encerramento'&&t.grupo!=='acordo'&&(()=>{const t0=C.titulos.find(x=>x.id==e.a_partir_titulo);return t0&&t.vencimento&&t.vencimento>=t0.vencimento})());
  if(sit&&sit.situacao==='cancelada'||enc)return 'cancelada';
  if(pags.length){const tarde=pags.some(p=>Number(p.multa_paga||0)+Number(p.juros_pago||0)+Number(p.honorarios_pago||0)>0.009||(p.confirmada_em&&(p.vencimento_boleto||t.vencimento)&&(new Date(p.confirmada_em)-new Date(p.vencimento_boleto||t.vencimento))/864e5>5));return t.grupo!=='acordo'&&tarde?'paga_atraso':'paga'}
  const ac=C.acordos.find(a=>(a.titulos_origem||[]).map(Number).includes(Number(t.id)));
  if(ac){const pago=C.titulos.some(x=>x.acordo_id==ac.id&&C.pagamentos.some(p=>p.titulo_id==x.id));return pago?'quitada_acordo':'em_acordo'}
  if(sit&&sit.situacao==='em_atraso')return 'em_atraso';
  if(t.vencimento&&t.vencimento<=hoje)return 'vencida';
  return 'futura';
}
function codTit(t){if(!t)return'?';if(t.grupo==='acordo'){const a=C.acordos.find(x=>x.id==t.acordo_id);return 'R'+(a?numAc(a):'')+(t.total>1?'.'+t.numero:'')}
  return ({mensal:'M',anual:'A',entrada:'E'}[t.grupo]||'P')+t.numero}
function origensAc(a){return (a.titulos_origem||[]).map(i=>codTit(C.titulos.find(t=>t.id==i))).join('+')}
function numAc(a){const l=[...C.acordos].sort((x,y)=>String(x.data_acordo).localeCompare(String(y.data_acordo))||x.id-y.id);return l.findIndex(x=>x.id==a.id)+1}
function acordoDe(t){return C.acordos.find(a=>(a.titulos_origem||[]).map(Number).includes(Number(t.id)))}
const NOMES={paga:'Paga em dia',paga_atraso:'Paga com atraso',quitada_acordo:'Paga em cobrança (acordo)',em_acordo:'Em acordo (sem pagamento ainda)',cancelada:'Cancelada',em_atraso:'Não paga (conferido)',vencida:'Vencida sem nada lançado',futura:'A vencer'};
function encDe(v,venc,ate){const dias=Math.max(0,Math.round((new Date(ate)-new Date(venc))/864e5));if(!dias)return{mu:0,ju:0,ho:0,dias};
  const mu=v*.02,ju=v*(Math.pow(1.01,dias/30)-1),ho=dias>60?(v+mu+ju)*.10:0;return{mu,ju,ho,dias}}
function totais(){
  let qv=0,esp=0,rec=0,pend=0;const pg={pr:0,mu:0,ju:0,ho:0},at={pr:0,mu:0,ju:0,ho:0,q:0};
  for(const t of C.titulos){const e=estado(t);const venc=t.vencimento&&t.vencimento<=C.hoje;if(e==='cancelada')continue;
    if(t.grupo!=='acordo'&&venc){qv++;esp+=valorAno(t)}
    if(e==='vencida')pend++;
    if(venc&&(e==='vencida'||e==='em_atraso')){const v=valorAno(t),k=encDe(v,t.vencimento,C.hoje);at.q++;at.pr+=v;at.mu+=k.mu;at.ju+=k.ju;at.ho+=k.ho}}
  for(const p of C.pagamentos){const v=Number(p.valor_pago||0);rec+=v;
    const mu=Number(p.multa_paga||0),ju=Number(p.juros_pago||0),ho=Number(p.honorarios_pago||0),base=v-mu-ju-ho;
    pg.mu+=mu;pg.ju+=ju;pg.ho+=ho;
    const t=C.titulos.find(x=>x.id==p.titulo_id),a=t&&t.grupo==='acordo'?C.acordos.find(x=>x.id==t.acordo_id):null;
    if(a&&Number(a.valor_acordado)>0){const f=base/Number(a.valor_acordado);pg.pr+=Number(a.principal||0)*f;pg.mu+=Number(a.multa||0)*f;pg.ju+=Number(a.juros||0)*f;pg.ho+=Number(a.honorarios||0)*f}
    else pg.pr+=base}
  at.tot=at.pr+at.mu+at.ju+at.ho;
  return {qv,esp,rec,pend,pg,at};
}

/* ---------- CONTRATO: tela ---------- */
async function abrirContrato(n){
  app.innerHTML='<div class="card">Carregando…</div>';
  C=await api('contrato/'+n);SEL.clear();SELMODO=false;desenhaContrato();
}
function btn(t){
  const e=estado(t),conf=C.pagamentos.filter(p=>p.titulo_id==t.id).length||C.situacoes.find(s=>s.titulo_id==t.id);
  const lab=t.grupo==='acordo'&&C.acordos.find(a=>a.id==t.acordo_id)?'Acordo '+numAc(C.acordos.find(a=>a.id==t.acordo_id))+(t.total>1?' · '+t.numero+'/'+t.total:''):t.grupo==='mensal'?'M '+t.numero:t.grupo==='anual'?'A '+t.numero:t.grupo==='entrada'?'E '+t.numero:t.grupo==='acordo'?'Ac '+t.numero:'P '+t.numero;
  return `<button class="pc ${e} ${t.grupo==='anual'?'anual':''} ${SEL.has(t.id)?'sel':''}" title="${esc(t.rotulo)} — ${dbr(t.vencimento)} — ${NOMES[e]}" onclick="clicaTitulo(${t.id})">
  ${conf?'<span class="cf">✓</span>':''}<b>${lab}</b><small>${dbr(t.vencimento).slice(0,5)}${t.vencimento?'/'+t.vencimento.slice(2,4):''}</small><small>${(e==='quitada_acordo'||e==='em_acordo')&&acordoDe(t)?'Acordo '+numAc(acordoDe(t)):brl(valorAno(t)).replace('R$','').trim()}</small>${t.grupo==='acordo'&&C.acordos.find(a=>a.id==t.acordo_id)?`<small style="font-weight:700">${esc(origensAc(C.acordos.find(a=>a.id==t.acordo_id)))}</small>`:''}</button>`;
}
function desenhaContrato(){
  const c=C.contrato,tt=totais(),T=C.titulos,base=T.filter(t=>t.grupo!=='acordo');
  const ent=base.filter(t=>t.grupo==='entrada'),men=base.filter(t=>t.grupo==='mensal'),anu=base.filter(t=>t.grupo==='anual'),out=base.filter(t=>t.grupo==='outra');
  let linhas='';
  if(ent.length)linhas+=`<div class="lin"><span class="rot">Entrada</span>${ent.map(btn).join('')}</div>`;
  const anos=Math.max(Math.ceil(men.length/12),anu.length);
  for(let a=0;a<anos;a++){const ms=men.slice(a*12,a*12+12),an=anu[a];
    linhas+=`<div class="lin"><span class="rot">Ano ${a+1}</span>${ms.map(btn).join('')}${an?'<span style="width:10px"></span>'+btn(an):''}</div>`}
  if(out.length)linhas+=`<div class="lin"><span class="rot">Outras</span>${out.map(btn).join('')}</div>`;
  const comp=(c.compradores||[]).map(x=>esc(x.nome)+(x.cpf?' <span class="mut">('+esc(x.cpf)+')</span>':'')).join('<br>')||esc(c.nome_planilha);
  const ac=C.acordos.length?'<div class="lin">'+[...C.acordos].sort((x,y)=>numAc(x)-numAc(y)).map(a=>{const ts=T.filter(t=>t.acordo_id==a.id);
    return `${ts.length?ts.map(btn).join(''):`<button class="pc ev evac" onclick="verAcordo(${a.id})"><b>Acordo ${numAc(a)}</b><small>${dbr(a.data_acordo).slice(0,5)}</small><small>sem parcelas</small></button>`}`}).join('')+'</div>':'<div class="mut">Nenhum acordo lançado.</div>';
  const co=C.correcoes.length?`<div class="lin">${C.correcoes.map(k=>`<button class="pc ev evco" onclick="verCorrecao(${k.id})"><b>Corr. ${k.grupo==='mensal'?'M':'A'} ${k.a_partir}</b><small>${k.data?dbr(k.data).slice(0,5)+'/'+String(k.data).slice(2,4):'—'}</small><small>${brl(k.novo_valor).replace('R$','').trim()}</small></button>`).join('')}</div>`:'<div class="mut">Nenhuma correção lançada.</div>';
  const ev=C.eventos.length?`<div class="lin">${C.eventos.map(e=>`<button class="pc ev evev" onclick="verEvento(${e.id})"><b>${e.tipo==='encerramento'?'Encerr.':'Cessão'}</b><small>${esc(T.find(t=>t.id==e.a_partir_titulo)?.rotulo.replace(/^(Mensal|Anual|Entrada) /,(m,g)=>g[0]+' ').replace(/\/\d+$/,'')||'?')}</small><small>${e.data?dbr(e.data).slice(0,5)+'/'+String(e.data).slice(2,4):'—'}</small></button>`).join('')}</div>`:'<div class="mut">Nenhum evento.</div>';
  const itens=(c.itens||[]).map(i=>`<li>${esc(i.texto)}</li>`).join('');
  app.innerHTML=`<div class="bt" style="margin-bottom:10px"><button onclick="location.hash='${COMO?'x/'+c.numero:''}'">${COMO?'← Voltar ao cruzamento':'← Contratos'}</button></div>
  ${COMO?'<div class="aviso" style="background:#eff6ff;color:#1e3a8a;border-color:#bfdbfe"><b>Você está editando a VERSÃO FINAL</b> (a verdade do sistema). Tudo o que salvar aqui vai para a versão final.</div>':''}
  <div class="card"><div class="bt" style="align-items:flex-start"><div style="flex:1"><h2 style="margin:0">Contrato ${c.numero} · Q${c.quadra} L${c.lote}</h2>
  <div>${comp}</div><div class="mut">Assinado em ${dbr(c.data_assinatura)} · Imóvel ${brl(c.valor_imovel)} · Fonte: ${esc(c.fonte)} "${esc(c.arquivo)}"</div></div>
  ${C.fechamento?`<span class="tag ok">Conferência fechada em ${new Date(C.fechamento.fechado_em).toLocaleString('pt-BR')}</span>`:''}</div>
  ${(c.alertas||[]).length?`<div class="aviso"><b>Pontos de atenção do contrato:</b><ul style="margin:4px 0 0 18px;padding:0">${c.alertas.map(a=>'<li>'+esc(a)+'</li>').join('')}</ul></div>`:''}
  <details><summary>Condições de pagamento (texto do contrato)</summary><ul>${itens}</ul></details></div>
  <div class="card"><div class="tot">
   <div><span class="mut">Parcelas vencidas</span><b>${tt.qv}</b></div><div><span class="mut">Deveria ter entrado</span><b>${brl(tt.esp)}</b></div>

function calcEncargos(){
  const cob=numBR($('#f_valor_cobranca').value),pago=numBR($('#f_valor_pago').value);if(cob==null||pago==null)return;
  const vo=$('#f_vencimento_original').value||$('#f_vencimento_boleto').value,dt=$('#f_confirmada_em').value;

  if(dif<0)de=-dif;
  else if(dif>0&&dias>0){mu=Math.min(dif,r2(cob*.02));const jEsp=r2(cob*(Math.pow(1.01,dias/30)-1));ju=Math.min(r2(dif-mu),jEsp);ho=r2(dif-mu-ju)}

  const put=(k,v)=>{$('#f_'+k).value=v?String(r2(v)).replace('.',','):'0'};put('multa_paga',mu);put('juros_pago',ju);put('honorarios_pago',ho);put('desconto_dado',de);

}

/* acordo */
function calcAcordo(ids,data){
  let pr=0,mu=0,ju=0,maxd=0;
  for(const id of ids){const t=C.titulos.find(x=>x.id==id);const v=valorAno(t);pr+=v;
    const dias=Math.max(0,Math.round((new Date(data)-new Date(t.vencimento))/864e5));maxd=Math.max(maxd,dias);
    if(dias>0){mu+=v*.02;ju+=v*(Math.pow(1.01,dias/30)-1)}}
  const ho=maxd>30?(pr+mu+ju)*.10:0;return {principal:r2(pr),multa:r2(mu),juros:r2(ju),honorarios:r2(ho),total:r2(pr+mu+ju+ho)};
}

  const desPars=()=>{window._P=P;$('#a_pars').innerHTML=P.map((p,i)=>`<tr><td>${i+1}</td><td><input type="date" data-i="${i}" data-k="vencimento" value="${p.vencimento}"></td><td><input data-i="${i}" data-k="valor" value="${String(p.valor).replace('.',',')}"></td></tr>`).join('');
    $('#a_pars').oninput=e=>{const i=e.target.dataset.i,k=e.target.dataset.k;if(i==null)return;P[i][k]=k==='valor'?num(e.target.value):e.target.value;soma()};soma()};

    return {contrato:C.contrato.numero,data_acordo:$('#a_data').value,titulos_origem:ids,principal:c.principal,multa:q.multa,juros:q.juros,honorarios:q.honorarios,

/* regra: principal, multa e juros calculados; o que sobrar é o custo de cobrança. Se não der, o que faltar sai dos juros e depois da multa (desconto). */
function repartir(c,v){let mu=c.multa,ju=c.juros,ho=r2(v-c.principal-mu-ju),de=0;
  if(ho<0){let falta=-ho;ho=0;const dj=Math.min(ju,falta);ju=r2(ju-dj);falta=r2(falta-dj);const dm=Math.min(mu,falta);mu=r2(mu-dm);falta=r2(falta-dm);de=r2(-(v-c.principal-c.multa-c.juros))}
  return {multa:r2(mu),juros:r2(ju),honorarios:r2(ho),desconto:de}}
async function salvaAcordo(aid){const b=window._salvaAcordoDados();
  const s=r2(b.parcelas.reduce((a,p)=>a+Number(p.valor||0),0));if(Math.abs(s-b.valor_acordado)>0.009)return alert('A soma das parcelas precisa ser igual ao valor acordado.');
  if(b.valor_acordado<b.principal-0.009&&!confirm('Valor acordado menor que o principal. Confirmar desconto na dívida?'))return;
  await api(aid?'acordo/'+aid:'acordo',{method:aid?'PUT':'POST',body:b});SEL.clear();SELMODO=false;fechaModal();recarrega()}

    <div class="cbt"><b>${c.numero}</b><span>Q${c.quadra} L${c.lote}</span></div><div class="cbn">${esc(c.titular)}</div>
    <div class="mut">Comparando: ${c.confs.map(x=>NOMECONF[x]).join(' × ')||'—'}</div>
    <div>${c.divergencias?`<span class="tag al">${c.pendentes} de ${c.divergencias} divergência(s) pendentes</span>`:'<span class="tag ok">Tudo igual</span>'} ${c.resolvido?'<span class="tag ok">Resolvido</span>':''}</div></button>`).join('')||'<div class="card">Nenhum contrato fechado pelos dois ainda.</div>'}</div>`;
}
async function cruzContrato(n){
  app.innerHTML='<div class="card">Carregando…</div>';
  X=await api('cruzamento/'+n);X.n=n;desenhaCruz();
}
function desenhaCruz(){
  const T=X.titulos,ct=X.dados.final.contrato||X.dados[X.confs[0]]?.contrato;
  const b=t=>{const cls=t.decidido?'cancelada':t.diverge?'vencida':'paga';
    return `<button class="pc ${cls} ${t.grupo==='anual'?'anual':''}" title="${esc(t.rotulo)}" onclick="cruzTitulo(${t.id})"><b>${t.grupo==='mensal'?'M':t.grupo==='anual'?'A':t.grupo==='entrada'?'E':'P'} ${t.numero}</b><small>${dbr(t.vencimento).slice(0,5)}${t.vencimento?'/'+t.vencimento.slice(2,4):''}</small><small>${t.decidido?'decidido':t.diverge?'DIVERGE':'igual'}</small></button>`};
  const ent=T.filter(t=>t.grupo==='entrada'),men=T.filter(t=>t.grupo==='mensal'),anu=T.filter(t=>t.grupo==='anual'),out=T.filter(t=>t.grupo==='outra');
  let lin='';if(ent.length)lin+=`<div class="lin"><span class="rot">Entrada</span>${ent.map(b).join('')}</div>`;
  for(let a=0;a<Math.max(Math.ceil(men.length/12),anu.length);a++)lin+=`<div class="lin"><span class="rot">Ano ${a+1}</span>${men.slice(a*12,a*12+12).map(b).join('')}${anu[a]?'<span style="width:10px"></span>'+b(anu[a]):''}</div>`;
  if(out.length)lin+=`<div class="lin"><span class="rot">Outras</span>${out.map(b).join('')}</div>`;
  const NS={acordos:'Acordos',correcoes:'Correções',eventos:'Encerramento e cessão'};
  const sec=X.secoes.map(s=>`<div class="card" style="margin:8px 0;border-left:5px solid ${s.decidido?'var(--ca)':s.diverge?'var(--ve)':'var(--pg)'}">
   <div class="bt" style="align-items:center"><b style="flex:1">${NS[s.secao]}</b>${s.decidido?`<span class="tag">decidido: ${esc(NOMECONF[s.decidido.de]||s.decidido.de)}</span>`:s.diverge?'<span class="tag al">DIVERGE</span>':'<span class="tag ok">igual</span>'}</div>
   <table><tbody>${X.confs.map(c=>`<tr><td style="width:130px"><b>${NOMECONF[c]}</b></td><td>${esc(s.sig[c]||'(nada lançado)')}</td><td style="width:150px">${s.diverge?`<button onclick="cruzUsar('secao','${s.secao}','${c}')">Usar esta versão</button>`:''}</td></tr>`).join('')}</tbody></table></div>`).join('');
  const nd=T.filter(t=>t.diverge).length+X.secoes.filter(s=>s.diverge).length,np=T.filter(t=>t.diverge&&!t.decidido).length+X.secoes.filter(s=>s.diverge&&!s.decidido).length;
  app.innerHTML=`<div class="bt" style="margin-bottom:10px"><button onclick="location.hash='x'">← Cruzamento</button></div>
  <div class="card"><h2 style="margin:0">Cruzamento · Contrato ${X.n} · Q${ct?.quadra} L${ct?.lote}</h2>
   <div class="mut">Comparando: ${X.confs.map(c=>NOMECONF[c]).join(' × ')} · ${nd} divergência(s), ${np} pendente(s)</div>
   ${X.dados.final.fechamento?`<div class="info">Contrato marcado como RESOLVIDO em ${new Date(X.dados.final.fechamento.fechado_em).toLocaleString('pt-BR')}</div>`:''}
   <div class="bt" style="margin-top:10px"><button class="pri" onclick="cruzAcao('aceitar_iguais')">Aceitar tudo que bate</button>
    <button onclick="location.hash='f/${X.n}'">Abrir versão final para editar</button><span style="flex:1"></span>
    ${X.dados.final.fechamento?`<button onclick="cruzAcao('reabrir')">Reabrir</button>`:`<button class="pri" onclick="cruzResolver(${np})">Marcar contrato resolvido</button>`}</div></div>
  <div class="card"><div class="leg"><span style="--c:var(--pg)">Igual nas conferências</span><span style="--c:var(--ve)">Diverge (clique para decidir)</span><span style="--c:var(--ca)">Já decidido</span></div><br>
   <div class="grid">${lin}</div></div><div class="card">${sec}</div>`;
}
function cruzTitulo(id){
  const t=X.titulos.find(x=>x.id==id);
  const col=c=>{const D=X.dados[c],pg=D.pagamentos.filter(p=>p.titulo_id==id),sit=D.situacoes.find(s=>s.titulo_id==id),est=(t.sig[c]||'').split('|')[0];
    return `<div class="card" style="flex:1;min-width:220px;margin:0"><h4 style="margin:0 0 6px">${NOMECONF[c]}</h4><div><b>${NOMES[est]||est}</b></div>
     ${sit?.obs?`<div class="mut">Obs.: ${esc(sit.obs)}</div>`:''}
     ${pg.map(p=>`<div class="pgl" style="display:block"><b>${brl(p.valor_pago)}</b> · entrou ${dbr(p.confirmada_em)}<br>fatura ${esc(p.fatura||'—')} · ${esc(p.forma||'')}<br><span class="mut">${esc((p.descricao||'').slice(0,160))}</span>${p.tem_print?`<br><button onclick="verPrintDe(${p.id},'${c}')">Ver print</button>`:''}</div>`).join('')||'<div class="mut">Nenhum pagamento lançado</div>'}
     <button class="pri" style="margin-top:8px" onclick="cruzUsar('titulo',${id},'${c}')">Usar esta versão</button></div>`};
  abreModal(`<div class="bt" style="align-items:center"><h3 style="flex:1">${esc(t.rotulo)} — vence ${dbr(t.vencimento)}</h3><button onclick="fechaModal()">Fechar</button></div>
   ${t.decidido?`<div class="info">Decidido: versão ${esc(NOMECONF[t.decidido.de]||t.decidido.de)} em ${new Date(t.decidido.em).toLocaleString('pt-BR')}</div>`:''}
   <div class="bt" style="align-items:stretch">${X.confs.map(col).join('')}</div>
   <div class="mut" style="margin-top:8px">Se nenhuma estiver certa, use "Abrir versão final para editar" e corrija direto na versão final.</div>`);
}
async function verPrintDe(id,c){const antes=COMO;COMO=c==='final'?'final':'';try{const d=await api('print/'+id);if(!d.conteudo)return alert('Print não disponível para a conferência de outra pessoa.');const w=window.open('');w.document.write(`<img src="${d.conteudo}" style="max-width:100%">`)}finally{COMO=antes}}
async function cruzUsar(tipo,alvo,de){
  await api('cruzamento/'+X.n,{method:'POST',body:tipo==='titulo'?{acao:'titulo',titulo_id:alvo,de}:{acao:'secao',secao:alvo,de}});
  fechaModal();cruzContrato(X.n);
}
async function cruzAcao(acao){await api('cruzamento/'+X.n,{method:'POST',body:{acao}});cruzContrato(X.n)}
async function cruzResolver(np){if(np&&!confirm(`Ainda há ${np} divergência(s) sem decisão. Marcar resolvido mesmo assim?`))return;cruzAcao('resolver')}

iniciar();
</script>
</body>
</html>
