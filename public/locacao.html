<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locação — Inerente</title>
<link rel="icon" href="logo.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#16181d;--mut:#6b7280;--ln:#e3e6eb;--az:#29c5f6;--pg:#16a34a;--ac:#eab308;--at:#b91c1c;--ve:#ef4444}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;align-items:center;gap:12px;padding:10px 20px;background:#111;color:#fff;position:sticky;top:0;z-index:5}
header img{height:28px}header b{font-size:16px}header .sp{flex:1}header a{color:#cbd5e1;text-decoration:none;font-size:13px}
main{max-width:1250px;margin:0 auto;padding:18px}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:#fff;border-radius:7px;padding:7px 12px}
button.pri{background:var(--az);border-color:var(--az);color:#00202d;font-weight:600}
button.per{color:var(--at);border-color:#fecaca}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;border:1px solid var(--ln);border-radius:7px;padding:7px 9px;width:100%;background:#fff}
textarea{min-height:60px}
label{font-size:12px;color:var(--mut);display:block;margin:0 0 3px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tot div{background:#f8fafc;border:1px solid var(--ln);border-radius:9px;padding:9px}
.tot b{display:block;font-size:17px}
.bt{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:20}
.modal .card{width:min(860px,100%);margin:0}
.aviso{background:#fef2f2;color:#7f1d1d;border:1px solid #fecaca;border-radius:8px;padding:8px 10px;margin:8px 0}
.info{background:#f0f9ff;color:#0c4a6e;border:1px solid #bae6fd;border-radius:8px;padding:8px 10px;margin:8px 0}
.ok{background:#f0fdf4;color:#14532d;border:1px solid #bbf7d0;border-radius:8px;padding:8px 10px;margin:8px 0}
.mut{color:var(--mut);font-size:12px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin:10px 0 20px}
.mod{text-align:left;background:var(--card);border:1px solid var(--ln);border-left:6px solid #1d4ed8;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-height:130px}
.mod:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}.mod b{font-size:19px}.mod span{color:#666}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.cb{text-align:left;background:#fff;border:1px solid var(--ln);border-left:5px solid #d1d5db;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:5px;cursor:pointer}
.cb:hover{box-shadow:0 3px 12px rgba(0,0,0,.07)}
.cb b{font-size:15px}.cb .v{font-size:17px;font-weight:700}
.cb.verde{border-left-color:var(--pg)}.cb.vermelho{border-left-color:var(--ve)}.cb.amarelo{border-left-color:var(--ac)}.cb.azul{border-left-color:#1d4ed8}.cb.cinza{border-left-color:#9ca3af;opacity:.8}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#eef2f7}
.tag.ok{background:#dcfce7;color:#14532d}.tag.al{background:#fee2e2;color:#7f1d1d}.tag.am{background:#fef9c3;color:#713f12}
.lin{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--ln)}
.lin:last-child{border-bottom:0}.neg{color:var(--at)}.pos{color:#15803d}
.mes{border:1px solid var(--ln);border-radius:12px;padding:12px;background:#fff}
.mes h4{margin:0 0 6px;display:flex;justify-content:space-between}
.abas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.abas button.on{background:#111;color:#fff;border-color:#111}
.dia{margin:16px 0 8px;font-weight:700;font-size:15px}
.hid{display:none}
@media print{header,.bt,.abas,.noprint{display:none!important}body{background:#fff}.card,.mes{border:0}}
</style>
</head>
<body>
<header><img src="logo.png" alt=""><b>Locação</b><span class="sp"></span><a href="/">← Carteira Beira Rio</a></header>
<main id="app"><div class="card">Carregando…</div></main>
<div id="modal"></div><div id="modal2"></div>
<script src="ferramentas/le-acerto-mensal.js"></script>
<script>
const $=s=>document.querySelector(s), app=$('#app');
let PIN='';try{PIN=localStorage.getItem('cbr_pin')||''}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dbr=d=>d?String(d).slice(0,10).split('-').reverse().join('/'):'—';
const R2=x=>Math.round((+x||0)*100)/100;
const hoje=()=>new Date(Date.now()-3*3600e3).toISOString().slice(0,10);
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const nomeMes=c=>c?MESES[+c.slice(5)-1].replace(/^./,x=>x.toUpperCase())+' '+c.slice(0,4):'';
const somaMes=(c,n)=>{const d=new Date(Date.UTC(+c.slice(0,4),+c.slice(5)-1+n,1));return d.toISOString().slice(0,7)};
const TIPOS={aluguel:'Aluguel',encargos:'Juros e multa',adm:'Administração',intermediacao:'Intermediação',condominio:'Condomínio',fundo_reserva:'Fundo de reserva',retencao:'Retido para condomínio',iptu:'IPTU',agua:'Água',energia:'Energia',gas:'Gás',manutencao:'Manutenção / outros gastos',caucao:'Caução',repasse:'Repasse',outros:'Outros'};
const sel=(id,opts,v)=>`<select id="${id}">${opts.map(o=>{const[k,t]=Array.isArray(o)?o:[o,o];return`<option value="${esc(k)}" ${String(v??'')===String(k)?'selected':''}>${esc(t)}</option>`}).join('')}</select>`;
const fecha=()=>{$('#modal').innerHTML=''};
const modal=h=>{$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)fecha()"><div class="card">${h}</div></div>`};
const modal2=h=>{$('#modal2').innerHTML=`<div class="modal" style="z-index:30"><div class="card">${h}</div></div>`};const fecha2=()=>{$('#modal2').innerHTML=''};
const val=id=>{const e=document.getElementById(id);if(!e)return undefined;if(e.type==='checkbox')return e.checked;return e.value.trim()};
async function api(path,opt={}){
  const r=await fetch('/api/'+path,{method:opt.method||'GET',headers:{'x-pin':PIN,'content-type':'application/json'},body:opt.body?JSON.stringify(opt.body):undefined});
  const d=await r.json().catch(()=>({erro:'Resposta inválida do servidor'}));
  if(r.status===401){location.href='/';throw new Error('401')}
  if(!r.ok||d?.erro){alert(d?.erro||'Erro');throw new Error(d?.erro||'erro')}
  return d;
}
const voltar=(h,t='← Início da locação')=>`<div class="bt noprint" style="margin-bottom:10px"><button onclick="location.hash='${h}'">${t}</button></div>`;

/* ---------- formulário genérico ---------- */
function campos(L,o={}){return `<div class="f2">${L.map(c=>{const v=o[c.k]??c.d??'';const id='f_'+c.k;
  let inp;if(c.t==='sel')inp=sel(id,c.o,v);else if(c.t==='chk')inp=`<label style="display:flex;gap:6px;align-items:center;color:var(--tx);font-size:14px"><input id="${id}" type="checkbox" style="width:auto" ${v?'checked':''}> ${esc(c.l)}</label>`;
  else if(c.t==='area')inp=`<textarea id="${id}">${esc(v)}</textarea>`;else inp=`<input id="${id}" type="${c.t||'text'}" ${c.t==='number'?'step="0.01"':''} value="${esc(c.t==='date'?String(v).slice(0,10):v)}">`;
  return `<div ${c.w?'style="grid-column:1/-1"':''}>${c.t==='chk'?'':`<label>${esc(c.l)}</label>`}${inp}</div>`}).join('')}</div>`}
const coleta=L=>{const o={};for(const c of L){const v=val('f_'+c.k);o[c.k]=c.t==='chk'?!!v:(v===''?null:v)}return o};

/* ---------- rotas ---------- */
let EU='';
async function iniciar(){
  if(!PIN){location.href='/';return}
  try{const e=await api('eu');EU=e.conferente}catch(e){return}
  if(EU!=='luis'){app.innerHTML='<div class="card"><h3>Locação</h3>Por enquanto a locação é só do administrador.</div>';return}
  route();
}
window.onhashchange=()=>route();
function route(){const h=location.hash.slice(1),[a,b]=h.split('/');fecha();
  if(a==='calendario')telaCalendario(b);else if(a==='imoveis')telaImoveis();else if(a==='imovel')telaImovel(b);else if(a==='pessoas')telaPessoas();
  else if(a==='locacoes')telaLocacoes();else if(a==='locacao')telaLocacao(b);else if(a==='inadimplencia')telaInad();else if(a==='reajustes')telaReajustes();
  else if(a==='importar')telaImportar();else telaInicio()}

/* ---------- início ---------- */
async function telaInicio(){
  const p=await api('loc/painel');
  app.innerHTML=`<div class="tot">
    <div><span class="mut">Contratos de locação ativos</span><b>${p.locacoes}</b></div>
    <div><span class="mut">Aluguel por mês</span><b>${brl(p.aluguel_mes)}</b></div>
    <div><span class="mut">Administração por mês</span><b>${brl(p.adm_mes)}</b></div>
    <div><span class="mut">Em atraso (com encargos)</span><b class="${p.atrasadas?'neg':''}">${p.atrasadas} · ${brl(p.atrasado_valor)}</b></div>
    <div><span class="mut">A repassar aos proprietários</span><b>${brl(p.a_repassar)}</b></div>
    <div><span class="mut">Reajustes no próximo mês</span><b>${p.reajustes}</b></div></div>
  <div class="mods">
    <div class="mod" style="border-left-color:#0d9488" onclick="location.hash='calendario'"><b>Calendário do mês</b><span>Dia 10, 20 e 30: quem pagou, quanto foi repassado e o que falta. Gera as cobranças do mês.</span></div>
    <div class="mod" style="border-left-color:#1d4ed8" onclick="location.hash='imoveis'"><b>Imóveis</b><span>${p.imoveis} imóvel(is). Ficha, contrato de administração, conta corrente do proprietário (acerto mensal) e documentos.</span></div>
    <div class="mod" style="border-left-color:#7c3aed" onclick="location.hash='locacoes'"><b>Contratos de locação</b><span>Inquilino, garantia, vencimento, cobranças, pagamentos, reajustes e encerramento.</span></div>
    <div class="mod" style="border-left-color:#b45309" onclick="location.hash='pessoas'"><b>Proprietários e inquilinos</b><span>${p.pessoas} cadastro(s). Um cadastro por CPF/CNPJ.</span></div>
    <div class="mod" style="border-left-color:#dc2626" onclick="location.hash='inadimplencia'"><b>Inadimplência</b><span>Aluguéis em atraso com multa, juros e cobrança calculados pelo contrato.</span></div>
    <div class="mod" style="border-left-color:#ca8a04" onclick="location.hash='reajustes'"><b>Reajustes</b><span>Aniversário dos contratos e índice acumulado buscado no Banco Central.</span></div>
    <div class="mod" style="border-left-color:#475569" onclick="location.hash='importar'"><b>Importar planilha</b><span>Traz o histórico da planilha "Acerto Mensal" de cada imóvel, mês a mês, conferindo com o total da planilha.</span></div>
  </div>`;
}

/* ---------- pessoas ---------- */
const C_PES=[{k:'nome',l:'Nome completo',w:1},{k:'tipo',l:'Tipo',t:'sel',o:[['pf','Pessoa física'],['pj','Empresa']]},{k:'documento',l:'CPF / CNPJ'},{k:'rg',l:'RG'},{k:'estado_civil',l:'Estado civil'},{k:'profissao',l:'Profissão'},{k:'nascimento',l:'Nascimento',t:'date'},{k:'telefone',l:'Telefone principal'},{k:'email',l:'E-mail'},{k:'endereco',l:'Endereço',w:1},{k:'pix',l:'Chave Pix (para repasse)'},{k:'banco',l:'Banco / agência / conta'},{k:'obs',l:'Observações',t:'area',w:1}];
let PES=[];
async function telaPessoas(){PES=await api('loc/pessoas');
  app.innerHTML=voltar('')+`<div class="card"><div class="bt"><h3 style="margin:0;flex:1">Proprietários e inquilinos</h3><input id="bp" placeholder="Buscar por nome, CPF ou telefone" style="max-width:320px" oninput="desenhaPessoas()"><button class="pri" onclick="modalPessoa()">+ Novo cadastro</button></div></div><div class="cgrid" id="lp"></div>`;desenhaPessoas()}
function desenhaPessoas(){const b=(val('bp')||'').toLowerCase().replace(/\D/g,'')||(val('bp')||'').toLowerCase();
  const L=PES.filter(p=>!b||(p.nome||'').toLowerCase().includes(b)||(p.documento||'').includes(b)||(p.telefone||'').replace(/\D/g,'').includes(b));
  $('#lp').innerHTML=L.map(p=>`<div class="cb ${p.inquilino_de?'azul':p.proprietario_de?'verde':''}" onclick="modalPessoa(${p.id})"><b>${esc(p.nome)}</b><span class="mut">${esc(p.documento||'sem CPF/CNPJ')} · ${esc(p.telefone||'sem telefone')}</span>
    ${p.proprietario_de?`<span class="tag ok">Proprietário: ${esc(p.proprietario_de)}</span>`:''}${p.inquilino_de?`<span class="tag">Inquilino: ${esc(p.inquilino_de)}</span>`:''}</div>`).join('')||'<div class="mut">Nenhum cadastro.</div>'}
function modalPessoa(id,depois){const p=PES.find(x=>x.id===id)||{};
  (depois?modal2:modal)(`<h3>${id?'Cadastro':'Novo cadastro'}</h3>${campos(C_PES,p)}${p.telefones_antigos?.length?`<div class="mut" style="margin-top:6px">Telefones antigos: ${p.telefones_antigos.map(esc).join(', ')}</div>`:''}
  <div class="bt" style="margin-top:12px"><button class="pri" onclick="salvaPessoa(${id||0})">Salvar</button><button onclick="${depois?'fecha2()':'fecha()'}">Cancelar</button>${id?`<button class="per" onclick="excluiPessoa(${id})">Excluir</button>`:''}</div>`);
  window._depoisPessoa=depois||null}
async function salvaPessoa(id){const b=coleta(C_PES);const r=await api('loc/pessoa'+(id?'/'+id:''),{method:id?'PUT':'POST',body:b});
  if(window._depoisPessoa){fecha2();const f=window._depoisPessoa;window._depoisPessoa=null;return f(r)}fecha();if(location.hash==='#pessoas')telaPessoas();else route()}
async function excluiPessoa(id){if(!confirm('Excluir esse cadastro?'))return;await api('loc/pessoa/'+id,{method:'DELETE'});fecha();telaPessoas()}
function novaPessoaEm(idCampo){modalPessoa(0,r=>{PES.push(r);const s=document.getElementById(idCampo);const o=document.createElement('option');o.value=r.id;o.textContent=r.nome;s.appendChild(o);s.value=r.id})}
async function escolhePessoa(idCampo,rotulo){PES=PES.length?PES:await api('loc/pessoas');
  return `<label>${rotulo}</label><div class="bt"><select id="${idCampo}" style="flex:1"><option value="">— escolha —</option>${PES.map(p=>`<option value="${p.id}">${esc(p.nome)}${p.documento?' · '+esc(p.documento):''}</option>`).join('')}</select><button type="button" onclick="novaPessoaEm('${idCampo}')">+ novo</button></div>`}

/* ---------- imóveis ---------- */
const C_IMO=[{k:'apelido',l:'Nome do imóvel (como vocês chamam)',w:1},{k:'tipo',l:'Tipo',t:'sel',o:[['apartamento','Apartamento'],['casa','Casa'],['sala','Sala comercial'],['loja','Loja'],['galpao','Galpão'],['terreno','Terreno'],['kitnet','Kitnet / studio'],['outro','Outro']]},
  {k:'endereco',l:'Endereço',w:1},{k:'unidade',l:'Unidade / torre'},{k:'condominio',l:'Condomínio (nome)'},{k:'administradora',l:'Administradora do condomínio'},{k:'matricula',l:'Matrícula'},{k:'inscricao_iptu',l:'Inscrição do IPTU'},
  {k:'area',l:'Área (m²)',t:'number'},{k:'quartos',l:'Quartos',t:'number'},{k:'vagas',l:'Vagas',t:'number'},{k:'energia',l:'Energia (nº da unidade consumidora)'},{k:'agua',l:'Água (matrícula Saneago)'},{k:'gas',l:'Gás (nº do cliente)'},
  {k:'extras_txt',l:'Garagens, box e escaninho com IPTU próprio (um por linha: descrição — inscrição)',t:'area',w:1},{k:'pasta',l:'Link da pasta no Drive',w:1},{k:'ativo',l:'Imóvel ativo na carteira',t:'chk',d:true},{k:'obs',l:'Observações',t:'area',w:1}];
async function telaImoveis(){const I=await api('loc/imoveis');
  app.innerHTML=voltar('')+`<div class="card"><div class="bt"><h3 style="margin:0;flex:1">Imóveis</h3><button class="pri" onclick="modalImovel()">+ Novo imóvel</button></div></div>
  <div class="cgrid">${I.map(i=>`<div class="cb ${!i.ativo?'cinza':i.locacao?'verde':'amarelo'}" onclick="location.hash='imovel/${i.id}'"><b>${esc(i.apelido)}</b>
    <span class="mut">Proprietário: ${esc(i.proprietario||'—')}</span>
    ${i.locacao?`<span>Inquilino: ${esc(i.locacao.locatario)}</span><span>${brl(i.locacao.aluguel)} · dia ${i.locacao.dia}</span>`:`<span class="tag am">${i.ativo?'Vago':'Inativo'}</span>`}
    <span class="mut">Saldo do proprietário: <b class="${+i.saldo<0?'neg':''}">${brl(i.saldo)}</b></span></div>`).join('')||'<div class="mut">Nenhum imóvel ainda. Cadastre ou use "Importar planilha".</div>'}</div>`}
async function modalImovel(id){let i={ativo:true};if(id){i=(await api('loc/imovel/'+id)).imovel;i.extras_txt=(i.extras||[]).map(x=>x.descricao+(x.inscricao?' — '+x.inscricao:'')).join('\n')}
  const pp=await escolhePessoa('f_proprietario_id','Proprietário');
  modal(`<h3>${id?'Ficha do imóvel':'Novo imóvel'}</h3>${campos(C_IMO,i)}<div style="margin-top:10px">${pp}</div>
  <div class="bt" style="margin-top:12px"><button class="pri" onclick="salvaImovel(${id||0})">Salvar</button><button onclick="fecha()">Cancelar</button>${id?`<button class="per" onclick="excluiImovel(${id})">Excluir</button>`:''}</div>`);
  if(i.proprietario_id)$('#f_proprietario_id').value=i.proprietario_id}
async function salvaImovel(id){const b=coleta(C_IMO);b.extras=(b.extras_txt||'').split('\n').map(s=>s.trim()).filter(Boolean).map(s=>{const[d,ins]=s.split(/\s+—\s+|\s+-\s+/);return{descricao:d,inscricao:ins||null}});delete b.extras_txt;
  b.proprietario_id=val('f_proprietario_id')||null;const r=await api('loc/imovel'+(id?'/'+id:''),{method:id?'PUT':'POST',body:b});fecha();location.hash='imovel/'+r.id;if(id)telaImovel(id)}
async function excluiImovel(id){if(!confirm('Excluir o imóvel? (só funciona se não tiver contrato nem lançamento)'))return;await api('loc/imovel/'+id,{method:'DELETE'});fecha();location.hash='imoveis'}

let IMO=null,ABA='conta';
async function telaImovel(id){IMO=await api('loc/imovel/'+id);const i=IMO.imovel;
  const ad=IMO.administracoes.find(a=>a.status==='ativo');const la=IMO.locacoes.find(l=>l.status==='ativa');
  app.innerHTML=voltar('imoveis','← Imóveis')+`<div class="card"><div class="bt"><h3 style="margin:0;flex:1">${esc(i.apelido)}</h3><button onclick="modalImovel(${i.id})">Ficha do imóvel</button></div>
   <div class="tot" style="margin-top:10px"><div><span class="mut">Proprietário</span><b>${esc(i.proprietario||'—')}</b></div>
   <div><span class="mut">Administração</span><b>${ad?(ad.taxa_tipo==='fixo'?brl(ad.taxa_valor):String(+ad.taxa_valor).replace('.',',')+'%'):'sem contrato'}</b></div>
   <div><span class="mut">Inquilino</span><b>${la?esc(la.locatario):'vago'}</b></div>
   <div><span class="mut">Saldo do proprietário</span><b class="${IMO.saldo<0?'neg':''}">${brl(IMO.saldo)}</b></div></div></div>
   <div class="abas noprint">${[['conta','Conta corrente (acerto mensal)'],['adm','Contrato de administração'],['loc','Locações'],['docs','Documentos']].map(([k,t])=>`<button class="${ABA===k?'on':''}" onclick="ABA='${k}';desenhaImovel()">${t}</button>`).join('')}</div><div id="abaimo"></div>`;
  desenhaImovel()}
function desenhaImovel(){document.querySelectorAll('.abas button').forEach((b,i)=>b.classList.toggle('on',['conta','adm','loc','docs'][i]===ABA));
  const el=$('#abaimo'),i=IMO.imovel;
  if(ABA==='conta'){const M=[...IMO.meses].reverse();
    el.innerHTML=`<div class="card noprint"><div class="bt"><button class="pri" onclick="modalLanc()">+ Lançar conta / despesa / crédito</button><button onclick="modalRepasse()">Registrar repasse</button><button onclick="window.print()">Imprimir</button></div>
     <div class="mut" style="margin-top:6px">Pagamento do inquilino entra sozinho (aluguel, juros e a administração). Aqui você lança as contas pagas pelo proprietário (condomínio, IPTU, Enel, Saneago, manutenção) e os repasses.</div></div>
     <div class="cgrid" style="grid-template-columns:repeat(auto-fill,minmax(330px,1fr))">${M.map(m=>`<div class="mes"><h4><span>${nomeMes(m.competencia)}</span><span class="${m.aRepassar<0?'neg':''}">${brl(m.aRepassar)}</span></h4>

const lerB64=f=>new Promise((ok,er)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=er;r.readAsDataURL(f)});
async function sobeArquivo(f,entidade,id,tipo){if(f.size>4.5e6){alert('Arquivo maior que 4,5 MB. Reduza o PDF antes de anexar.');throw new Error('grande')}
  return api('loc/documento',{method:'POST',body:{entidade,entidade_id:id,tipo,nome:f.name,mime:f.type,base64:await lerB64(f)}})}
function desenhaDocs(el,ent,id,L){el.innerHTML=`<div class="card noprint"><div class="bt"><select id="d_t" style="max-width:260px">${['Contrato de locação assinado','Contrato de administração','Vistoria de entrada','Vistoria de saída','Documentos pessoais','Comprovante de repasse','Conta paga (desconto)','Boleto','Recibo','Confissão de dívida','Acerto de saída','Outros'].map(t=>`<option>${t}</option>`).join('')}</select>
  <input id="d_f" type="file" multiple style="max-width:320px"><button class="pri" onclick="anexa('${ent}',${id},this)">Anexar</button></div></div>
  <div class="cgrid">${L.map(d=>`<div class="cb azul"><b>${esc(d.tipo||'Documento')}</b><span>${esc(d.nome)}</span><span class="mut">${dbr(d.em)} · ${Math.round((d.bytes||0)/1024)} KB</span><div class="bt"><button onclick="abreDoc(${d.id})">Abrir</button><button class="per" onclick="apagaDoc(${d.id},'${ent}',${id})">Excluir</button></div></div>`).join('')||'<div class="mut">Nenhum documento anexado.</div>'}</div>`}
async function anexa(ent,id,bt){const fs=[...$('#d_f').files];if(!fs.length)return alert('Escolha o arquivo');bt.disabled=true;
  try{for(const f of fs)await sobeArquivo(f,ent,id,val('d_t'))}finally{bt.disabled=false}route()}
async function abreDoc(id){const w=window.open('','_blank');const r=await fetch('/api/loc/documento/'+id,{headers:{'x-pin':PIN}});if(!r.ok){w.close();return alert('Não consegui abrir')}w.location=URL.createObjectURL(await r.blob())}

   <div class="card" style="background:#f8fafc;margin-top:10px"><b>Registrar pagamento</b><div class="f2" style="margin-top:8px"><div><label>Data do pagamento</label><input id="p_d" type="date" value="${hoje()}"></div><div><label>Valor pago</label><input id="p_v" type="number" step="0.01" value="${(e.total||m.total).toFixed?(e.total||m.total).toFixed(2):m.total}"></div>
   <div><label>Forma</label>${sel('p_f',['Pix','Boleto BTG','Transferência','Dinheiro','Caução','Acordo'],'Pix')}</div></div><div class="mut" style="margin-top:6px">Valor acima da cobrança vira "juros e multa"; abaixo vira desconto no aluguel. A administração é descontada sozinha na conta do proprietário.</div>
   <div class="bt" style="margin-top:10px"><button class="pri" onclick="paga(${m.id})">Registrar pagamento</button><button class="per" onclick="cancelaM(${m.id})">Cancelar cobrança</button></div></div>`
  :m.situacao==='paga'?`<div class="ok">Pago em ${dbr(m.pago_em)}: ${brl(m.valor_pago)} (${esc(m.forma||'')})${+m.encargos_pagos?` · juros/multa ${brl(m.encargos_pagos)}`:''}${+m.desconto?` · desconto ${brl(m.desconto)}`:''}</div>
   ${m.itens.map(x=>`<div class="lin"><span>${esc(x.descricao)}</span><span>${brl(x.valor)}</span></div>`).join('')}<div class="bt" style="margin-top:10px"><button class="per" onclick="estorna(${m.id})">Desfazer pagamento</button><button onclick="recibo(${m.id})">Recibo</button></div>`
  :`<div class="info">Cobrança cancelada. ${esc(m.obs||'')}</div>`}<div class="bt" style="margin-top:10px"><button onclick="fecha()">Fechar</button></div>`)}
function maisItem(n){const i=document.querySelectorAll('[id^=mi_d]').length;$('#mi_n').insertAdjacentHTML('beforeend',`<div class="f2" style="margin-bottom:6px"><div>${sel('mi_t'+i,[['outros','Outros'],['condominio','Condomínio'],['iptu','IPTU'],['agua','Água'],['energia','Energia'],['gas','Gás'],['encargos','Juros e multa']],'outros')}</div><div><input id="mi_d${i}" placeholder="descrição"></div><div><input id="mi_v${i}" type="number" step="0.01"></div></div>`)}
async function salvaItens(id){const n=document.querySelectorAll('[id^=mi_d]').length;const itens=[];for(let i=0;i<n;i++)itens.push({tipo:val('mi_t'+i),descricao:val('mi_d'+i),valor:val('mi_v'+i)});
  await api('loc/mensalidade/'+id,{method:'PUT',body:{itens,vencimento:val('m_v')}});fecha();telaLocacao(LOC.locacao.id)}
async function paga(id){await api('loc/mensalidade/'+id+'/pagar',{method:'POST',body:{pago_em:val('p_d'),valor_pago:val('p_v'),forma:val('p_f')}});fecha();telaLocacao(LOC.locacao.id)}
async function estorna(id){if(!confirm('Desfazer o pagamento? Os lançamentos dele saem da conta do proprietário.'))return;const r=await api('loc/mensalidade/'+id+'/estornar',{method:'POST',body:{}});if(r.aviso)alert(r.aviso);fecha();telaLocacao(LOC.locacao.id)}
async function cancelaM(id){const o=prompt('Motivo do cancelamento:');if(o===null)return;await api('loc/mensalidade/'+id+'/cancelar',{method:'POST',body:{obs:o}});fecha();telaLocacao(LOC.locacao.id)}
function recibo(id){const m=LOC.mensalidades.find(x=>x.id===id),l=LOC.locacao;const w=window.open('','_blank');
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Recibo ${nomeMes(m.competencia)}</title><style>body{font:14px Arial;max-width:680px;margin:40px auto;line-height:1.6}h2{text-align:center}.wm{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:300px;opacity:.08;z-index:-1}table{width:100%;border-collapse:collapse}td{padding:4px 0;border-bottom:1px solid #ddd}td:last-child{text-align:right}</style></head><body><img class="wm" src="${location.origin}/ferramentas/wm.png">
  <h2>RECIBO DE ALUGUEL</h2><p>Recebemos de <b>${esc(l.locatario)}</b> a importância de <b>${brl(m.valor_pago)}</b>, referente à locação do imóvel <b>${esc(l.apelido)}</b>, competência <b>${nomeMes(m.competencia)}</b>, pago em ${dbr(m.pago_em)}.</p>
  <table>${m.itens.map(x=>`<tr><td>${esc(x.descricao)}</td><td>${brl(x.valor)}</td></tr>`).join('')}${+m.encargos_pagos?`<tr><td>Juros e multa por atraso</td><td>${brl(m.encargos_pagos)}</td></tr>`:''}${+m.desconto?`<tr><td>Desconto</td><td>-${brl(m.desconto)}</td></tr>`:''}<tr><td><b>Total pago</b></td><td><b>${brl(m.valor_pago)}</b></td></tr></table>
  <p style="margin-top:50px;text-align:center">Goiânia, ${new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'})}.<br><br>______________________________<br>Inerente Gestão Imobiliária · CRECI 19898-GO</p><script>onload=()=>print()<\/script></body></html>`);w.document.close()}
function modalEncerrar(id){modal(`<h3>Encerrar locação</h3><div class="f2"><div><label>Data da saída (entrega das chaves)</label><input id="e_d" type="date" value="${hoje()}"></div><div><label>Motivo</label>${sel('e_m',['Fim do contrato','Rescisão pelo inquilino','Rescisão pelo proprietário','Despejo','Outro'],'Fim do contrato')}</div></div>
  <div class="info">As cobranças em aberto com vencimento depois da saída são canceladas. O proporcional do último mês e o acerto de saída você lança na cobrança do mês e na conta do proprietário.</div>
  <div class="bt"><button class="per" onclick="encerra(${id})">Encerrar</button><button onclick="fecha()">Cancelar</button></div>`)}
async function encerra(id){const r=await api('loc/locacao/'+id+'/encerrar',{method:'POST',body:{data:val('e_d'),motivo:val('e_m')}});fecha();alert(`Locação encerrada. ${r.canceladas} cobrança(s) futura(s) cancelada(s).`);telaLocacao(id)}
async function modalReajuste(id,data){modal('<h3>Reajuste</h3>Buscando o índice no Banco Central…');let r;try{r=await api(`loc/reajuste/${id}${data?'?data='+data:''}`)}catch(e){return fecha()}
  modal(`<h3>Reajuste do aluguel</h3><div class="f2"><div><label>Data do reajuste (aniversário)</label><input id="rj_d" type="date" value="${r.data}" onchange="modalReajuste(${id},this.value)"></div><div><label>Índice</label><b>${esc(r.indice)}</b></div>
   <div><label>Percentual acumulado (pode ajustar)</label><input id="rj_p" type="number" step="0.01" value="${r.percentual}" oninput="$('#rj_n').value=(${r.aluguel}*(1+this.value/100)).toFixed(2)"></div><div><label>Novo aluguel</label><input id="rj_n" type="number" step="0.01" value="${r.novo}"></div></div>
   <div class="mut" style="margin-top:6px">Aluguel atual ${brl(r.aluguel)}. ${r.meses.length?`Meses usados: ${r.meses.map(x=>x.mes.slice(5)+'/'+x.mes.slice(2,4)+' '+String(x.pct).replace('.',',')+'%').join(' · ')}`:''}</div>
   ${r.percentual<0?'<div class="aviso">O índice acumulado ficou negativo. Muitos contratos não reduzem o aluguel; confira a cláusula antes de aplicar.</div>':''}
   <div class="bt" style="margin-top:12px"><button class="pri" onclick="aplicaReajuste(${id},${JSON.stringify(r.meses).replace(/"/g,'&quot;')})">Aplicar reajuste</button><button onclick="fecha()">Cancelar</button></div>`)}
async function aplicaReajuste(id,meses){const r=await api('loc/reajuste/'+id,{method:'POST',body:{data:val('rj_d'),percentual:val('rj_p'),novo:val('rj_n'),memoria:meses}});fecha();alert(`Aluguel reajustado para ${brl(r.novo)}. ${r.cobrancas_atualizadas} cobrança(s) em aberto atualizada(s).`);route()}

/* ---------- calendário ---------- */
async function telaCalendario(c){const d=await api('loc/calendario/'+(c||''));const comp=d.competencia;
  const dias=[...new Set(d.itens.map(x=>x.dia_vencimento))];
  const rec=d.itens.filter(x=>x.cobranca?.situacao==='paga').reduce((s,x)=>s+ +x.cobranca.valor_pago,0),rep=d.itens.reduce((s,x)=>s+ +x.repassado,0),adm=-d.itens.reduce((s,x)=>s+ +x.adm,0);
  app.innerHTML=voltar('')+`<div class="card"><div class="bt"><button onclick="location.hash='calendario/${somaMes(comp,-1)}'">◀</button><h3 style="margin:0">${nomeMes(comp)}</h3><button onclick="location.hash='calendario/${somaMes(comp,1)}'">▶</button><span style="flex:1"></span><button class="pri" onclick="geraMes('${comp}')">Gerar cobranças do mês</button></div>
   <div class="tot" style="margin-top:10px"><div><span class="mut">Contratos</span><b>${d.itens.length}</b></div><div><span class="mut">Aluguel do mês</span><b>${brl(d.itens.reduce((s,x)=>s+ +x.aluguel,0))}</b></div><div><span class="mut">Recebido</span><b>${brl(rec)}</b></div><div><span class="mut">Administração</span><b>${brl(adm)}</b></div><div><span class="mut">Repassado</span><b>${brl(rep)}</b></div></div></div>
   ${dias.map(dd=>`<div class="dia">Dia ${dd}</div><div class="cgrid">${d.itens.filter(x=>x.dia_vencimento===dd).map(x=>{const cb=x.cobranca;const atr=cb&&cb.situacao==='aberta'&&cb.vencimento<d.hoje;
     const cor=!cb?'':cb.situacao==='paga'?(+x.repassado?'verde':'azul'):atr?'vermelho':'amarelo';
     return `<div class="cb ${cor}" onclick="location.hash='locacao/${x.id}'"><b>${esc(x.apelido)}</b><span class="mut">${esc(x.locatario)}</span><span class="v">${brl(cb?cb.total:x.aluguel)}</span>
     <span>${!cb?'<span class="tag">Cobrança não gerada</span>':cb.situacao==='paga'?`<span class="tag ok">Recebido ${dbr(cb.pago_em)}</span>`:cb.situacao==='cancelada'?'<span class="tag">Cancelada</span>':atr?'<span class="tag al">Em atraso</span>':`<span class="tag am">Vence ${dbr(cb.vencimento)}</span>`}</span>
     <span>${+x.repassado?`<span class="tag ok">Repassado ${brl(x.repassado)}</span>`:cb?.situacao==='paga'?`<span class="tag am">Falta repassar · saldo ${brl(x.saldo)}</span>`:''}</span></div>`}).join('')}</div>`).join('')||'<div class="mut">Nenhum contrato ativo nesse mês.</div>'}`}
async function geraMes(c){if(!confirm('Gerar as cobranças de '+nomeMes(c)+' para todos os contratos ativos?'))return;const r=await api('loc/mensalidades/gerar',{method:'POST',body:{competencia:c}});alert(`${r.criadas} cobrança(s) criada(s) de ${r.locacoes} contrato(s).`);telaCalendario(c)}

/* ---------- inadimplência ---------- */
let INAD=[];
function zapInad(i){const x=INAD[i];const fone=String(x.telefone).replace(/\D/g,'').replace(/^55/,'');
  const txt=`Olá, ${x.locatario.split(' ')[0]}, tudo bem? Aqui é da Inerente. O aluguel de ${nomeMes(x.competencia)} do imóvel ${x.apelido} ainda consta em aberto. Podemos resolver isso hoje?`;
  window.open('https://wa.me/55'+fone+'?text='+encodeURIComponent(txt))}
async function telaInad(){const L=INAD=await api('loc/inadimplencia');const tot=L.reduce((s,x)=>s+x.encargos.total,0);
  app.innerHTML=voltar('')+`<div class="card"><h3>Inadimplência</h3><div class="tot"><div><span class="mut">Cobranças em atraso</span><b>${L.length}</b></div><div><span class="mut">Valor hoje (com encargos)</span><b class="neg">${brl(tot)}</b></div></div></div>
  <div class="cgrid">${L.map((x,i)=>`<div class="cb vermelho" onclick="location.hash='locacao/${x.locacao_id}'"><b>${esc(x.apelido)}</b><span>${esc(x.locatario)} ${x.telefone?'· '+esc(x.telefone):''}</span><span>${nomeMes(x.competencia)} · venceu ${dbr(x.vencimento)} (${x.encargos.dias} dias)</span>
   <span class="v">${brl(x.encargos.total)}</span><span class="mut">Original ${brl(x.total)} + multa ${brl(x.encargos.multa)} + juros ${brl(x.encargos.juros)}${x.encargos.cobranca?' + cobrança '+brl(x.encargos.cobranca):''}${x.encargos.honorarios?' + honorários '+brl(x.encargos.honorarios):''}</span>${+x.caucao_valor?`<span class="mut">Caução: ${brl(x.caucao_valor)}</span>`:''}
   ${x.telefone?`<button onclick="event.stopPropagation();zapInad(${i})">WhatsApp</button>`:''}</div>`).join('')||'<div class="ok">Nenhum aluguel em atraso.</div>'}</div>`}

/* ---------- reajustes ---------- */
async function telaReajustes(){const L=await api('loc/reajustes');const h=hoje();
  app.innerHTML=voltar('')+`<div class="card"><h3>Reajustes</h3><div class="mut">Aniversário de cada contrato ativo. Clique para calcular pelo índice do contrato.</div></div>
  <div class="cgrid">${L.map(x=>{const venc=x.aniversario<=h,perto=x.aniversario<=somaMes(h.slice(0,7),1)+'-31';return `<div class="cb ${x.indice==='sem'?'cinza':venc?'vermelho':perto?'amarelo':'verde'}" onclick="${x.indice==='sem'?'':`modalReajuste(${x.id})`}"><b>${esc(x.apelido)}</b><span>${esc(x.locatario)}</span><span>${brl(x.aluguel)} · ${esc(x.indice)}</span>
   <span>${x.indice==='sem'?'Sem reajuste':venc?`<span class="tag al">Vencido desde ${dbr(x.aniversario)}</span>`:`<span class="tag ${perto?'am':''}">Próximo: ${dbr(x.aniversario)}</span>`}</span></div>`}).join('')||'<div class="mut">Nenhum contrato ativo.</div>'}</div>`}

/* ---------- importar planilha "Acerto Mensal" ---------- */
let IMP=null;
async function telaImportar(){const I=await api('loc/imoveis');
  app.innerHTML=voltar('')+`<div class="card"><h3>Importar a planilha "Acerto Mensal" de um imóvel</h3>
   <div class="mut">Escolha o arquivo Acerto Mensal.xlsx do imóvel (fica na pasta do imóvel, no Drive). O sistema lê mês a mês, mostra a prévia e confere com o total "À RECEBER" da planilha. Nada é gravado antes de você confirmar.</div>
   <div class="f2" style="margin-top:10px"><div><label>Arquivo</label><input id="i_f" type="file" accept=".xlsx,.xls" onchange="leArquivo()"></div>
   <div><label>Imóvel no sistema</label>${sel('i_im',[['','— criar um imóvel novo com o nome da planilha —'],...I.map(i=>[i.id,i.apelido])],'')}</div></div></div><div id="i_prev"></div>`}
function carregaXLSX(){return window.XLSX?Promise.resolve():new Promise((ok,er)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>er(new Error('Não consegui carregar o leitor de planilhas'));document.head.appendChild(s)})}
async function leArquivo(){const f=$('#i_f').files[0];if(!f)return;$('#i_prev').innerHTML='<div class="card">Lendo…</div>';await carregaXLSX();
  const wb=XLSX.read(new Uint8Array(await f.arrayBuffer()),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,blankrows:false});
  const lido=LeAcerto.leLinhas(rows);if(!lido.blocos.length){$('#i_prev').innerHTML='<div class="aviso">Não encontrei meses nessa planilha (esperava linhas como "Maio - 2026").</div>';return}
  IMP={lido,nome:f.name};
  const I=[...$('#i_im').options];const t=String(lido.titulo||'').toLowerCase().replace(/[^a-z0-9]/g,'');const ach=I.find(o=>o.value&&o.text.toLowerCase().replace(/[^a-z0-9]/g,'')===t);if(ach)$('#i_im').value=ach.value;
  desenhaPrevia()}
function desenhaPrevia(){const ultRep=$('#i_ult')?$('#i_ult').checked:true;const p=LeAcerto.preparaImportacao(IMP.lido,ultRep);IMP.prep=p;
  const ign=IMP.lido.blocos.filter(b=>b.ignorar);const div=p.meses.filter(m=>m.confere===false),sem=p.meses.filter(m=>m.confere===null).length;
  $('#i_prev').innerHTML=`<div class="card"><h3>${esc(IMP.lido.titulo||IMP.nome)}</h3><div class="tot"><div><span class="mut">Meses</span><b>${p.meses.length}</b></div><div><span class="mut">De / até</span><b>${nomeMes(p.meses[0].competencia)} — ${nomeMes(p.meses.at(-1).competencia)}</b></div>
   <div><span class="mut">Conferem com a planilha</span><b>${p.meses.filter(m=>m.confere).length}</b></div><div><span class="mut">Divergem</span><b class="${div.length?'neg':''}">${div.length}</b></div><div><span class="mut">Sem total na planilha</span><b>${sem}</b></div><div><span class="mut">Saldo que fica</span><b>${brl(p.saldoFinal)}</b></div></div>
   ${ign.length?`<div class="info">${ign.map(b=>esc(b.aviso)).join('<br>')}</div>`:''}
   <label style="display:flex;gap:6px;align-items:center;margin-top:10px;color:var(--tx);font-size:14px"><input id="i_ult" type="checkbox" style="width:auto" ${ultRep?'checked':''} onchange="desenhaPrevia()"> O último mês (${nomeMes(p.meses.at(-1).competencia)}) já foi repassado ao proprietário</label>
   <label style="display:flex;gap:6px;align-items:center;margin-top:6px;color:var(--tx);font-size:14px"><input id="i_sub" type="checkbox" style="width:auto"> Substituir o que foi importado antes para esse imóvel</label>
   <div class="bt" style="margin-top:12px"><button class="pri" onclick="confirmaImport(this)">Confirmar importação</button></div>
   <div class="mut" style="margin-top:6px">O repasse de cada mês é considerado feito quando o mês seguinte não traz "saldo do mês anterior" e a planilha não diz "não foi feita a transferência". Meses com valor na planilha diferente do calculado aparecem em vermelho.</div></div>
   <div class="cgrid" style="grid-template-columns:repeat(auto-fill,minmax(330px,1fr))">${[...p.meses].reverse().map(m=>`<div class="mes" style="${m.confere===false?'border-color:#ef4444;border-width:2px':''}"><h4><span>${nomeMes(m.competencia)}</span><span>${brl(m.calculado)}</span></h4>
    ${m.aviso?`<div class="tag am" style="margin-bottom:6px">${esc(m.aviso)}</div>`:''}${m.anterior?`<div class="lin"><span class="mut">Saldo do mês anterior</span><span>${brl(m.anterior)}</span></div>`:''}
    ${m.itens.map(x=>`<div class="lin"><span>${esc(x.descricao)} <span class="tag">${esc(TIPOS[x.tipo]||x.tipo)}</span></span><span class="${x.valor<0?'neg':'pos'}">${brl(x.valor)}</span></div>`).join('')}
    ${m.planilha!==null?`<div class="lin"><span class="mut">Na planilha</span><span class="${m.confere?'pos':'neg'}">${brl(m.planilha)} ${m.confere?'✓':'≠'}</span></div>`:''}${m.notas.length?`<div class="mut">${m.notas.map(esc).join(' · ')}</div>`:''}</div>`).join('')}</div>`}
async function confirmaImport(bt){let im=val('i_im');const p=IMP.prep;
  if(!confirm(`Gravar ${p.meses.length} meses (${p.meses.reduce((s,m)=>s+m.itens.length,0)} lançamentos)?`))return;bt.disabled=true;
  try{if(!im){const r=await api('loc/imovel',{method:'POST',body:{apelido:IMP.lido.titulo||IMP.nome.replace(/\.xlsx?$/i,'')}});im=r.id}
   const r=await api('loc/importar',{method:'POST',body:{imovel_id:+im,substituir:$('#i_sub').checked,meses:p.meses.map(m=>({competencia:m.competencia,itens:m.itens}))}});
   alert(`Importado: ${r.lancamentos} lançamentos. Saldo do proprietário no sistema: ${brl(r.saldo)} (na planilha: ${brl(p.saldoFinal)}).`);location.hash='imovel/'+im}
  finally{bt.disabled=false}}

iniciar();
</script>
